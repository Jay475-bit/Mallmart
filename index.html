// --- Mini remplacement de framer-motion (CSS transitions) ---
const AnimatePresence = ({ children }) => children;
const toStyle = (o = {}) => {
  const st = {}; const tf = [];
  const val = (v) => (Array.isArray(v) ? v[v.length - 1] : v);
  if (o.opacity !== undefined) st.opacity = val(o.opacity);
  if (o.width !== undefined) st.width = val(o.width);
  if (o.scale !== undefined) tf.push(`scale(${val(o.scale)})`);
  if (o.x !== undefined) tf.push(`translateX(${val(o.x)}px)`);
  if (o.y !== undefined) tf.push(`translateY(${val(o.y)}px)`);
  if (tf.length) st.transform = tf.join(' ');
  return st;
};
const motion = new Proxy({}, {
  get: (_, tag) => function Motion({ initial, animate, exit, transition, style, ...rest }) {
    const [on, setOn] = useState(false);
    useEffect(() => { const t = setTimeout(() => setOn(true), 30); return () => clearTimeout(t); }, []);
    const d = (transition && transition.duration) || 0.5;
    const delay = (transition && transition.delay) || 0;
    const st = { ...(initial && !on ? toStyle(initial) : {}), ...(on ? toStyle(animate) : {}), ...style,
      transition: `all ${d}s ease ${delay}s` };
    return React.createElement(tag, { ...rest, style: st });
  }
});

// ===== IMAGE UTILS =====
// Redimensionne et compresse une image avant envoi (économise la data mobile en Haïti)
async function compressImage(file, maxSize = 1200, quality = 0.75) {
  if (!(file instanceof File) || !file.type.startsWith('image/')) return file;

  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve(file);
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => resolve(file);
      img.onload = () => {
        const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(
          (blob) => {
            if (!blob || blob.size >= file.size) return resolve(file);
            resolve(new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg', lastModified: Date.now() }));
          },
          'image/jpeg',
          quality
        );
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}


// ===== PRODUCT QUOTA =====


function ProductQuota({ shop, totalProducts = 0, onUpgradeClick }) {
  const planKey = (shop?.plan_type || 'free').toLowerCase();
  const planInfo = MALLMART_PLANS[planKey] || MALLMART_PLANS.free;

  const maxProducts = planInfo.maxProducts;
  const percentage = Math.min(Math.round((totalProducts / maxProducts) * 100), 100);

  let progressBg = "bg-emerald-500";
  if (percentage >= 66) progressBg = "bg-amber-500";
  if (percentage >= 100) progressBg = "bg-red-500";

  return (
    <div className="flex items-center gap-3 bg-[#141416] border border-slate-800/80 px-3 py-1.5 rounded-full shadow-sm">
      {/* Badge du plan */}
      <span 
        className="text-[10px] font-black uppercase px-2 py-0.5 rounded-full text-white"
        style={{ backgroundColor: planInfo.color }}
      >
        {planInfo.name}
      </span>

      {/* Compteur & Mini barre */}
      <div className="flex items-center gap-2">
        <span className="text-[11px] font-bold text-slate-200">
          {totalProducts}/{maxProducts} <span className="text-[10px] font-normal text-slate-400">prod.</span>
        </span>

        <div className="w-16 bg-slate-800 h-1.5 rounded-full overflow-hidden border border-slate-700/50">
          <div 
            className={`h-full transition-all duration-300 ${progressBg}`}
            style={{ width: `${percentage}%` }}
          />
        </div>
      </div>

      {/* Bouton Upgrade compact */}
      <button
        type="button"
        onClick={onUpgradeClick}
        className="text-[10px] font-extrabold text-royal-400 hover:text-royal-300 bg-royal-500/10 hover:bg-royal-500/20 px-2 py-0.5 rounded-md transition-all"
      >
        Upgrade ↗

    </div>
  );
}

// ===== UPGRADE MODAL =====



function UpgradeModal({ isOpen, onClose, currentPlanKey = 'free', shopId, shopName }) {
  const [selectedPlanKey, setSelectedPlanKey] = useState(null);
  const [txnCode, setTxnCode] = useState('');
  const [loading, setLoading] = useState(false);
  const [statusMessage, setStatusMessage] = useState('');

  if (!isOpen) return null;

  const handleOpenPayment = (key) => {
    setSelectedPlanKey(key);
    setStatusMessage('');
    setTxnCode('');
  };

  const handleSubmitTransaction = async (e) => {
    e.preventDefault();
    if (!txnCode.trim()) {
      alert("Veuillez saisir le numéro / code de transaction reçu par SMS.");
      return;
    }

    const targetPlan = MALLMART_PLANS[selectedPlanKey];
    if (!targetPlan) return;

    setLoading(true);
    setStatusMessage('');

    try {
      const { error } = await supabase
        .from('plan_requests')
        .insert([
          {
            shop_id: shopId,
            requested_plan: selectedPlanKey,
            amount_paid: targetPlan.price,
            payment_method: 'natcash',
            transaction_code: txnCode.trim(),
            status: 'pending'
          }
        ]);

      if (error) {
        if (error.code === '23505') {
          throw new Error("Ce code de transaction a déjà été soumis.");
        }
        throw error;
      }

      setStatusMessage("⏳ Transaction enregistrée ! Vérification automatique Natcash en cours...");
      setTxnCode('');
    } catch (err) {
      alert("Erreur : " + err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn">
      <div className="bg-[#141416] border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        
        {/* Bouton Fermer */}

          onClick={onClose}
          className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/60 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold cursor-pointer"
        >
          ✕
        </button>

        {/* Titre */}
        <div className="text-center mb-6">
          <h2 className="text-xl font-black text-white">Changer de Forfait 🚀</h2>
          <p className="text-xs text-slate-400 mt-1">
            Augmentez la capacité de votre boutique Mallmart et vendez plus.
          </p>
        </div>

        {/* Vue 1: Liste des Plans de MALLMART_PLANS */}
        {!selectedPlanKey ? (
          <div className="space-y-3">
            {Object.entries(MALLMART_PLANS).map(([key, plan]) => {
              const isCurrent = currentPlanKey.toLowerCase() === key.toLowerCase();

              return (
                <div 
                  key={key}
                  className={`p-4 rounded-2xl border transition-all flex items-center justify-between ${
                    isCurrent 
                      ? 'border-royal-500 bg-royal-500/10' 
                      : 'border-slate-800 bg-[#1C1C1F]/50 hover:border-slate-700'
                  }`}
                >
                  <div>
                    <div className="flex items-center gap-2">
                      <span 
                        className="text-xs font-black uppercase px-2 py-0.5 rounded-full text-white"
                        style={{ backgroundColor: plan.color || '#3B97DC' }}
                      >
                        {plan.name}
                      </span>
                      {isCurrent && (
                        <span className="text-[10px] font-bold text-royal-400 uppercase tracking-wider">
                          • Plan Actuel
                        </span>
                      )}
                    </div>

                    <div className="text-xs text-slate-300 font-bold mt-1.5">
                      Jusqu'à <span className="text-white font-extrabold">{plan.maxProducts === Infinity ? 'Produits Illimités' : `${plan.maxProducts} produits`}</span>
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="text-sm font-black text-white">
                      {plan.price === 0 ? 'Gratuit' : `${plan.price} HTG`}
                      {plan.price > 0 && <span className="text-[10px] text-slate-400 font-normal">/mois</span>}
                    </div>

                    {!isCurrent && plan.price > 0 && (
                      <button
                        onClick={() => handleOpenPayment(key)}
                        className="mt-1 px-3 py-1 bg-royal-600 hover:bg-royal-500 text-white font-extrabold text-[10px] rounded-lg transition-all cursor-pointer"
                      >
                        Choisir ↗
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          /* Vue 2: Formulaire de paiement Natcash pour le plan sélectionné */
          <form onSubmit={handleSubmitTransaction} className="space-y-4">
            <button
              type="button"
              onClick={() => setSelectedPlanKey(null)}
              className="text-xs text-royal-400 font-bold hover:underline mb-2 block cursor-pointer"
            >
              ← Revenir aux autres forfaits
            </button>

            <div className="bg-royal-600/10 p-4 rounded-2xl border border-royal-500/30 text-xs space-y-2">
              <div className="flex justify-between items-center border-b border-royal-500/20 pb-2">
                <span className="text-slate-300 font-bold">Forfait sélectionné :</span>
                <span className="text-white font-black uppercase text-sm">{MALLMART_PLANS[selectedPlanKey]?.name}</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-slate-300 font-bold">Montant à payer :</span>
                <span className="text-emerald-400 font-black text-sm">{MALLMART_PLANS[selectedPlanKey]?.price} HTG</span>
              </div>
            </div>

            <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700 text-xs space-y-1">
              <p className="text-royal-400 font-extrabold uppercase tracking-wider">Instructions Natcash</p>
              <p className="text-slate-300">Effectuez le transfert Natcash du montant exact au :</p>
              <p className="text-amber-400 font-black text-base pt-1">
                📲 Natcash: +509 42 62 77 08
              </p>
            </div>

            <div>
              <label className="text-xs text-slate-400 font-bold block mb-1">
                Numéro / Ref de transaction Natcash (SMS)
              </label>
              <input
                type="text"
                placeholder="Ex: 89342189"
                value={txnCode}
                onChange={(e) => setTxnCode(e.target.value)}
                className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-royal-500"
              />
            </div>

            {statusMessage && (
              <p className="text-xs text-amber-400 font-bold bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 text-center">
                {statusMessage}
              </p>
            )}

            <div className="flex gap-2 pt-2">
              <button

                onClick={() => setSelectedPlanKey(null)}
                className="w-1/3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl cursor-pointer"
              >
                Annuler
              </button>
              <button
                type="submit"
                disabled={loading}
                className="w-2/3 py-3 bg-gradient-to-r from-royal-600 to-royal-600 hover:from-royal-500 hover:to-royal-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition-all cursor-pointer"
              >
                {loading ? 'Validation...' : 'Confirmer le paiement'}
              </button>
            </div>
          </form>
        )}

      </div>
    </div>
  );
}

// ===== STORE CREATION MODAL =====


const STEPS = [
  { id: 1, label: "Validation des informations...", duration: 1500 },
  { id: 2, label: "Configuration de la base de données...", duration: 2000 },
  { id: 3, label: "Préparation de votre tableau de bord...", duration: 1800 },
  { id: 4, label: "Finalisation et mise en ligne...", duration: 1500 }
];

function StoreCreationModal({ isOpen, onComplete }) {
  const [currentStepIndex, setCurrentStepIndex] = useState(0);
  const [progress, setProgress] = useState(0);
  const [isSlowNetwork, setIsSlowNetwork] = useState(false);

  useEffect(() => {
    if (!isOpen) {
      setCurrentStepIndex(0);
      setProgress(0);
      setIsSlowNetwork(false);
      return;
    }

    if (navigator.vibrate) {
      navigator.vibrate(40);
    }

    const slowTimer = setTimeout(() => {
      setIsSlowNetwork(true);
    }, 7000);

    let stepTimer;
    const runSteps = (index) => {
      if (index < STEPS.length) {
        setCurrentStepIndex(index);
        const targetProgress = ((index + 1) / STEPS.length) * 100;
        setProgress(targetProgress);

        stepTimer = setTimeout(() => {
          runSteps(index + 1);
        }, STEPS[index].duration);
      } else {
        setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate([60, 100, 60]);
          if (onComplete) onComplete();
        }, 800);
      }
    };

    runSteps(0);

    return () => {
      clearTimeout(stepTimer);
      clearTimeout(slowTimer);
    };
  }, [isOpen]);

  if (!isOpen) return null;

  return (
    <AnimatePresence mode="wait">
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <motion.div
          initial={{ opacity: 0, scale: 0.9, y: 20 }}
          animate={{ opacity: 1, scale: 1, y: 0 }}
          exit={{ opacity: 0, scale: 0.9, y: -20 }}
          className="w-full max-w-sm bg-[#0A0A0B] border border-white/10 rounded-3xl p-6 text-white shadow-2xl relative overflow-hidden"
        >
          {/* Halo d'ambiance en arrière-plan */}
          <div className="absolute -top-12 -right-12 w-40 h-40 bg-royal-600/20 rounded-full blur-3xl pointer-events-none" />
          <div className="absolute -bottom-12 -left-12 w-40 h-40 bg-amber-600/20 rounded-full blur-3xl pointer-events-none" />

          {/* Icône animée */}
          <div className="flex justify-center mb-6">
            <div className="relative flex items-center justify-center w-20 h-20 rounded-2xl bg-white/5 border border-white/10">
              <motion.div
                className="absolute inset-0 rounded-2xl bg-gradient-to-tr from-royal-500/30 to-amber-500/30 blur-md"
                animate={{ scale: [1, 1.15, 1], opacity: [0.5, 0.9, 0.5] }}
                transition={{ duration: 2, repeat: Infinity, ease: "easeInOut" }}
              />
              <span className="text-3xl relative z-10 animate-bounce">🏪</span>
            </div>
          </div>

          {/* Titre */}
          <h3 className="text-xl font-bold text-center bg-gradient-to-r from-royal-400 to-amber-400 bg-clip-text text-transparent mb-1">
            Création de votre boutique
          </h3>
          <p className="text-xs text-gray-400 text-center mb-6">
            Veuillez patienter pendant l'initialisation
          </p>

          {/* Liste des sous-étapes */}
          <div className="space-y-3 mb-6">
            {STEPS.map((step, idx) => {
              const isDone = idx < currentStepIndex;
              const isCurrent = idx === currentStepIndex;

              return (
                <div key={step.id} className="flex items-center gap-3">
                  <div className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300">
                    {isDone ? (
                      <span className="w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500 text-emerald-400 flex items-center justify-center">
                        ✓
                      </span>
                    ) : isCurrent ? (
                      <span className="w-6 h-6 rounded-full bg-royal-500/20 border border-royal-400 text-royal-300 flex items-center justify-center animate-pulse">
                        {step.id}
                      </span>
                    ) : (
                      <span className="w-6 h-6 rounded-full bg-white/5 border border-white/10 text-gray-500 flex items-center justify-center">
                        {step.id}
                      </span>
                    )}
                  </div>
                  <span
                    className={`text-xs transition-colors duration-300 ${
                      isDone
                        ? 'text-emerald-400 line-through opacity-70'
                        : isCurrent
                        ? 'text-white font-medium'
                        : 'text-gray-500'
                    }`}
                  >
                    {step.label}
                  </span>
                </div>
              );
            })}
          </div>

          {/* Barre de progression globale */}
          <div className="w-full bg-white/5 h-2 rounded-full overflow-hidden border border-white/10 mb-3">
            <motion.div
              className="h-full bg-gradient-to-r from-royal-500 via-royal-500 to-amber-400"
              animate={{ width: `${progress}%` }}
              transition={{ duration: 0.5, ease: "easeInOut" }}
            />
          </div>

          {/* Indication réseau / Message d'attente */}
          <div className="h-5 text-center">
            {isSlowNetwork ? (
              <motion.p
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                className="text-[11px] text-amber-400/90 font-medium animate-pulse"
              >
                Connexion un peu lente... Ne quittez pas !
              </motion.p>
            ) : (
              <p className="text-[11px] text-gray-400">
                {Math.round(progress)}% complété
              </p>
            )}
          </div>
        </motion.div>
      </div>
    </AnimatePresence>
  );
}

const uploadToImgBB = async (file) => {
  if (!file) return null;

  if (typeof file === 'string') return file;

  const formData = new FormData();
formData.append('image', file);

try {

    });

    if (data.success) {
      return data.data.url; // Renvoie le lien direct (ex: https://i.ibb.co/...)
    } else {
      throw new Error("Échec du téléversement sur ImgBB");
    }
  } catch (error) {

    throw error;
  }
};

// 2. COMPRESSION OPTIONNELLE DU LOGO AVANT IMGBB
// =========================================================
const compressStoreLogo = async (file, quality = 0.7) => {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    if (!(file instanceof File)) return resolve(file); // Si c'est déjà une URL

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0, img.width, img.height);

        canvas.toBlob(
          (blob) => {
            if (!blob) return resolve(file);
            const compressedFile = new File([blob], file.name || "logo.jpg", {
              type: "image/jpeg",
              lastModified: Date.now(),
            });
            resolve(compressedFile);
          },
          "image/jpeg",
          quality
        );
      };
      img.onerror = () => resolve(file);
    };
    reader.onerror = () => resolve(file);
  });
};

const handleToggleShopActive = async (shop) => {
  const currentStatus = shop.is_active !== false; // true si actif ou undefined
  const newStatus = !currentStatus;

  try {
    const { data: updatedShop, error } = await supabase
      .from('shops')
      .update({ is_active: newStatus })
      .eq('id', shop.id)
      .select()
      .single();

    if (error) throw error;

    setRegisteredShops((prev) => 
      prev.map(s => s.id === shop.id ? updatedShop : s)
    );
  } catch (err) {
    alert("Erreur lors du changement de statut : " + err.message);
  }
};

const [adminSearchQuery, setAdminSearchQuery] = useState('');
const [planRequests, setPlanRequests] = useState([]);

const loadPlanRequests = async () => {
  const { data, error } = await supabase
    .from('plan_requests')
    .select('*')
    .eq('status', 'pending')
    .order('created_at', { ascending: false });
  if (!error) setPlanRequests(data || []);
};

useEffect(() => {
  if (isAdminLoggedIn) loadPlanRequests();
}, [isAdminLoggedIn]);

const handlePlanRequest = async (req, approve) => {
  try {
    if (approve) {
      const { error: shopErr } = await supabase
        .from('shops')
        .update({ plan_type: req.requested_plan, is_active: true })
        .eq('id', req.shop_id);
      if (shopErr) throw shopErr;
    }
    const { error } = await supabase
      .from('plan_requests')
      .update({ status: approve ? 'approved' : 'rejected' })
      .eq('id', req.id);
    if (error) throw error;
    setPlanRequests((prev) => prev.filter((r) => r.id !== req.id));
    if (approve) await loadAppData();
  } catch (err) {
    alert("Erreur : " + err.message);
  }
};

const formatPrice = (price, currency = 'HTG') => {
  if (price === undefined || price === null || isNaN(price)) return '0';

  const num = Math.round(Number(price));
  const formattedNumber = new Intl.NumberFormat('fr-FR').format(num);

  if (currency === 'USD' || currency === '$') {
    return `$${formattedNumber}`;
  }

  return `${formattedNumber} ${currency}`;
};

<button

    // Validation selon le type de plan
    if (selectedPlan.isPaid) {

      }
    }

    // 🚀 DÉCLENCHEMENT DE L'ANIMATION ET VERROUILLAGE
    setIsCreatingStore(true);

    try {
      // 1. Vérifier si le nom existe déjà dans Supabase
      const { data: existingShops, error: checkError } = await supabase
        .from('shops')
        .select('id')
        .ilike('shop_name', formData.shopName.trim());

      if (checkError) throw checkError;

      if (existingShops && existingShops.length > 0) {
        setIsCreatingStore(false); // Ferme l'animation si erreur
        alert("Ce nom de boutique est déjà pris ! Choisissez un autre nom unique.");
        return;
      }

      // 2. Upload du logo vers ImgBB via API FormData
      let logoUrl = '';
      let deleteUrl = '';

      if (formData.logo && formData.logo instanceof File) {
        const imgData = new FormData();
        imgData.append('image', formData.logo);

        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: imgData,
        });

        const imgbbJson = await imgbbRes.json();

        if (!imgbbJson.success) {
          throw new Error("Échec de l'envoi de l'image sur ImgBB.");
        }

        logoUrl = imgbbJson.data.url;
        deleteUrl = imgbbJson.data.delete_url;
      }

      // 3. Insertion de la boutique dans la table 'shops'
      const newShopData = {
        shop_name: formData.shopName.trim(),
        whatsapp: formData.whatsapp,
        password: formData.password,
        owner_name: formData.ownerName,
        logo_url: logoUrl,

        transaction_code: selectedPlan.isPaid ? formData.transactionCode : 'FREE-PLAN',
        is_active: !selectedPlan.isPaid
      };

      const { data: insertedShop, error: insertError } = await supabase
        .from('shops')
        .insert([newShopData])
        .select()
        .single();

      if (insertError) throw insertError;

      // 3b. Plan payant : on enregistre la demande pour validation admin

          amount_paid: selectedPlan.price,
          payment_method: formData.paymentMethod,
          transaction_code: formData.transactionCode.trim(),
          status: 'pending'

            : reqError;
        }

      // 4. Mise à jour de l'état local et préparation de la redirection
      setMyShop(insertedShop);
      setIsLoggedIn(true);

      setStoreCreated(false);

        </button>
        <button 
          onClick={async () => {
            const newPrice = parseFloat(discountValue);
            const currentPrice = parseFloat(discountingProduct.price);

            if (!discountValue || isNaN(newPrice)) {
              alert("Veuillez entrer un montant valide.");
              return;
            }
            if (newPrice >= currentPrice) {
              alert("Le prix discount doit être strictement inférieur au prix actuel.");
              return;
            }

            try {
              const { data: updatedProduct, error } = await supabase
                .from('products')
                .update({ discount_price: newPrice })
                .eq('id', discountingProduct.id)
                .select()
                .single();

              if (error) throw error;

              setVendorProducts(vendorProducts.map(p => p.id === updatedProduct.id ? updatedProduct : p));
              setDiscountingProduct(null);

              alert("Erreur lors de l'application du discount : " + err.message);

              className="w-full h-full object-cover"
            />
          ) : (
            <span className="text-2xl">📦</span>
          )}
        </div>
        <div className="flex-1 min-w-0">
          <h4 className="text-sm font-black text-[#111111] uppercase tracking-wide truncate">
            {orderModalProduct.name}
          </h4>
          <div className="flex items-center gap-2 mt-1">
  {orderModalProduct.discount_price ? (
    <>
      {/* Ancien Prix Barré */}
      <span className="text-slate-400 text-[11px] font-bold line-through">
        {formatPrice(orderModalProduct.price, orderModalProduct.currency || 'HTG')}
      </span>

      {/* Prix Réduit */}
      <span className="text-rose-500 text-sm font-black">
        {formatPrice(orderModalProduct.discount_price, orderModalProduct.currency || 'HTG')}
      </span>
    </>
  ) : (
    /* Prix Normal */
    <span className="text-[#111111] text-sm font-black">
      {formatPrice(orderModalProduct.price || 0, orderModalProduct.currency || 'HTG')}
    </span>
  )}
  <span className="text-[9px] text-[#4B5563]/70 font-bold uppercase">/ unité</span>
</div>
        </div>
      </div>

      {/* ---------------- COULEURS DISPONIBLES (INFO SEULEMENT) ---------------- */}
{Array.isArray(orderModalProduct.colors) && orderModalProduct.colors.length > 0 && (
  <div className="px-6 py-2">
    <p className="text-[10px] font-black text-[#4B5563] uppercase tracking-widest mb-2">
      Couleurs disponibles
    </p>
    <div className="flex flex-wrap gap-2.5 bg-white/40 p-2.5 rounded-2xl border border-white/60">
      {orderModalProduct.colors.map((colorName) => {
        const colorMap = {
          'Rouge': '#EF4444',
          'Bleu foncé': '#1E3A8A',
          'Bleu ciel': '#38BDF8',
          'Vert': '#10B981',
          'Jaune': '#FACC15',
          'Rouge grenat': '#800020',
          'Marron': '#78350F',
          'Beige': '#F5F5DC',
          'Gris': '#6B7280',
          'Jaune abricot': '#FBCEB1',
          'Rose': '#F472B6',
          'Noir': '#0F172A',
          'Blanc': '#FFFFFF'
        };

        return (
          <div
            key={colorName}
            title={colorName}
            style={{ backgroundColor: colorMap[colorName] || '#9CA3AF' }}
            className="w-7 h-7 rounded-full border border-black/10 shadow-sm"
          />
        );
      })}
    </div>
  </div>
)}

{/* ---------------- TAILLES DISPONIBLES (INFO SEULEMENT) ---------------- */}
{Array.isArray(orderModalProduct.sizes) && orderModalProduct.sizes.length > 0 && (
  <div className="px-6 py-2">
    <p className="text-[10px] font-black text-[#4B5563] uppercase tracking-widest mb-2">
      Tailles disponibles
    </p>
    <div className="flex flex-wrap gap-1.5 bg-white/40 p-2.5 rounded-2xl border border-white/60">
      {orderModalProduct.sizes.map((sz) => (
        <span
          key={sz}
          className="px-3 py-1.5 rounded-xl text-xs font-black bg-white/80 text-[#111111] border border-white"
        >
          {sz}
        </span>
      ))}
    </div>
  </div>
)}

      {/* Sélecteur de quantité */}
      <div className="px-6 py-3">
        <p className="text-[10px] font-black text-[#4B5563] uppercase tracking-widest mb-2">
          Quantité
        </p>
        <div className="flex items-center justify-between bg-white/50 border border-white/60 rounded-2xl px-4 py-3 shadow-inner">
          <button
            onClick={() => typeof setOrderQuantity === 'function' && setOrderQuantity(q => Math.max(1, q - 1))}
            className="w-9 h-9 bg-white/80 hover:bg-[#D1D5DB] text-[#111111] font-black text-lg flex items-center justify-center rounded-xl transition-all active:scale-90 shadow-sm"
          >
            −
          </button>
          <span className="text-xl font-black text-[#111111]">{orderQuantity || 1}</span>
          <button
            onClick={() => typeof setOrderQuantity === 'function' && setOrderQuantity(q => q + 1)}
            className="w-9 h-9 bg-[#63B3ED] text-[#0b1b2b] font-black text-lg flex items-center justify-center rounded-xl transition-all active:scale-90 shadow-md"
          >
            +
          </button>
        </div>
      </div>

      {/* Pointillés type reçu */}
      <div className="mx-6 border-t-2 border-dashed border-[#111111]/15 my-1" />

      {/* Total */}
      <div className="px-6 py-4 flex items-center justify-between">
        <span className="text-xs font-black text-[#4B5563] uppercase tracking-widest">
          Total
        </span>
        <span className="text-2xl font-black text-[#111111]">
  {formatPrice(
    (orderModalProduct.discount_price || orderModalProduct.price || 0) * (orderQuantity || 1),
    orderModalProduct.currency || 'HTG'
  )}
</span>
      </div>

      {/* Description produit */}
      {orderModalProduct.description && (
        <div className="px-6 py-3 bg-white/40 border border-white/60 mx-4 rounded-2xl mb-2 shadow-xs">
          <p className="text-[10px] font-black text-[#4B5563] uppercase tracking-widest mb-1.5">
            📝 Description du vendeur
          </p>
          <p className="text-[11px] text-[#111111]/90 leading-relaxed font-medium">
            {orderModalProduct.description}
          </p>
        </div>
      )}

     {/* Bouton Confirmer */}
<div className="px-6 pt-3 pb-8 flex justify-center">
  <button
    type="button"
    onClick={handleConfirmOrder}
    className="relative z-50 w-full bg-[#63B3ED] hover:opacity-95 active:scale-95 text-[#0b1b2b] py-3.5 rounded-2xl font-black uppercase tracking-wider text-xs shadow-md transition-all"
  >
    Confirmer ma commande
  </button>
      </div>
    </div>
  </div>
)}

{/* -------------------- ÉCRAN CONNEXION ADMIN -------------------- */}
{currentScreen === 'admin-login' && (
  <div className="bg-gradient-to-b from-[#0A4D68] via-[#2B7FC4] to-[#18181B] min-h-screen pb-24 font-sans flex flex-col justify-center">
    <div className="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full px-6">
      <div className="bg-white/10 backdrop-blur-md rounded-[2.25rem] p-6 shadow-2xl border border-white/10">
        
        <div className="text-center mb-6">
          <span className="text-3xl">🔐</span>
          <h2 className="text-xl font-black text-white uppercase tracking-tight mt-2">
            Espace Admin
          </h2>
          <p className="text-[11px] text-royal-200/70 font-bold mt-1 uppercase tracking-wide">
            Accès réservé
          </p>
        </div>

        {adminLoginError && (
          <div className="bg-red-500/10 text-red-300 font-bold text-[11px] p-3 rounded-xl mb-4 border border-red-500/20 text-center uppercase tracking-wide">
            ⚠️ {adminLoginError}
          </div>
        )}

        <form onSubmit={async (e) => {
          e.preventDefault();
          setAdminLoginError('');

          try {
            const { data: admins, error } = await supabase
              .from('admin_users')
              .select('*')
              .eq('username', adminLoginUsername.trim());

            if (error) throw error;

            const adminFound = admins && admins.length > 0 ? admins[0] : null;

            if (adminFound && adminFound.password === adminLoginPassword) {
              setCurrentAdmin(adminFound);
              setIsAdminLoggedIn(true);
              setCurrentScreen('admin-dashboard');
            } else {
              setAdminLoginError("Identifiant ou mot de passe incorrect");
            }
          } catch (err) {
            console.error("Erreur de connexion admin :", err.message);
            setAdminLoginError("Erreur de connexion au serveur. Réessayez.");
          }
        }} className="flex flex-col gap-4">

          <div>
            <label className="block text-[10px] font-black text-[#63B3ED] uppercase tracking-widest mb-1.5">
              Identifiant
            </label>
            <input 
              type="text"
              autoComplete="off"
              required
              value={adminLoginUsername}
              onChange={(e) => setAdminLoginUsername(e.target.value)}
              className="w-full bg-white/10 border border-white/20 rounded-xl py-2.5 px-4 text-xs font-bold text-white outline-none focus:border-[#63B3ED] transition-all"
            />
          </div>

          <div>
            <label className="block text-[10px] font-black text-[#63B3ED] uppercase tracking-widest mb-1.5">
              Mot de passe
            </label>
            <input 
              type="password"
              autoComplete="new-password"
              required
              placeholder="••••••••"
              value={adminLoginPassword}
              onChange={(e) => setAdminLoginPassword(e.target.value)}
              className="w-full bg-white/10 border border-white/20 rounded-xl py-2.5 px-4 text-xs font-bold text-white outline-none focus:border-[#63B3ED] transition-all"
            />
          </div>

          <button 
            type="submit"
            className="w-full mt-2 bg-[#63B3ED] text-[#0b1b2b] font-black text-xs py-3 rounded-xl shadow-lg shadow-royal-500/20 active:scale-95 transition-all uppercase tracking-wider"
          >
            Se connecter
          </button>

          <button
            type="button"
            onClick={() => setCurrentScreen('admin-forgot-password')}
            className="text-[10px] text-royal-200/60 font-bold text-center hover:text-royal-200 transition-colors mt-1"
          >
            Mot de passe oublié ?
          </button>
        </form>
      </div>
    </div>
  </div>
)}

{/* -------------------- DASHBOARD ADMIN -------------------- */}
{currentScreen === 'admin-dashboard' && (
  <div className="min-h-screen bg-[#0A0A0B] text-slate-100 p-4 font-sans pb-24">
    
    {/* Header */}
    <div className="flex justify-between items-center mb-6 px-4 pt-4 pb-3 -mx-4 sticky top-0 z-30 bg-white/10 backdrop-blur-xl border-b border-white/10">
      <div>
        <h1 className="text-lg font-black text-white">
          👋 Bonjour, {currentAdmin?.full_name || 'Admin'}
        </h1>
        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
          Panneau d'administration
        </p>
      </div>
      <button 
        onClick={() => {
          setIsAdminLoggedIn(false);
          setCurrentAdmin(null);
          setCurrentScreen('home');
        }}
        className="bg-[#1C1C1F] hover:bg-[#27272B] border border-slate-800 text-slate-300 font-bold text-[10px] px-3 py-2 rounded-xl transition-all active:scale-95"
      >
        Déconnexion
      </button>
    </div>

    {/* Stats rapides */}
    <div className="grid grid-cols-3 gap-2 mb-6 px-2">
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-[#63B3ED]">{registeredShops.length}</p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Boutiques</p>
      </div>
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-emerald-400">
          {registeredShops.filter(s => s.is_active !== false).length}
        </p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Actives</p>
      </div>
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-royal-400">{vendorProducts.length}</p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Produits</p>
      </div>
    </div>

    {/* Demandes de forfait à valider (MonCash / NatCash) */}
    <div className="px-2 mb-6">
      <h3 className="text-xs font-black text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
        <span className="w-1.5 h-4 rounded-full bg-amber-500"></span>
        Paiements à valider ({planRequests.length})
      </h3>
      {planRequests.length === 0 ? (
        <p className="text-[11px] text-slate-500 font-bold bg-[#141416] rounded-2xl p-4 text-center border border-slate-800/60">Aucune demande en attente</p>
      ) : (
        <div className="flex flex-col gap-2">
          {planRequests.map((req) => {
            const reqShop = registeredShops.find((sh) => sh.id === req.shop_id);
            return (
              <div key={req.id} className="bg-[#141416] border border-amber-500/20 rounded-2xl p-3 text-[11px]">
                <p className="font-black text-white">{reqShop?.shop_name || 'Boutique inconnue'} → <span className="uppercase text-amber-400">{req.requested_plan}</span></p>
                <p className="text-slate-400 mt-0.5">{req.amount_paid} HTG · {req.payment_method} · Code : <span className="text-white font-bold">{req.transaction_code}</span></p>
                <div className="flex gap-2 mt-2">
                  <button onClick={() => handlePlanRequest(req, true)} className="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-black text-[10px] uppercase active:scale-95">Valider</button>
                  <button onClick={() => handlePlanRequest(req, false)} className="flex-1 py-2 rounded-xl bg-slate-700 text-slate-200 font-black text-[10px] uppercase active:scale-95">Refuser</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>

    {/* Recherche */}
    <div className="px-2 mb-4">
      <input
        type="text"
        placeholder="Rechercher une boutique..."
        value={adminSearchQuery}
        onChange={(e) => setAdminSearchQuery(e.target.value)}
        className="w-full h-11 bg-[#141416] border border-slate-800 focus:border-royal-500 rounded-xl px-4 text-white placeholder:text-slate-500 outline-none transition-all text-xs"
      />
    </div>

    {/* Liste des boutiques */}
    <div className="px-2">
      <h3 className="text-xs font-black text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
        <span className="w-1.5 h-4 rounded-full bg-royal-500"></span>
        Toutes les boutiques
      </h3>

      {registeredShops.length === 0 ? (
        <div className="text-center py-12 bg-[#141416] rounded-3xl border-2 border-dashed border-slate-800">
          <p className="text-[11px] text-slate-400 font-bold">Aucune boutique enregistrée</p>
        </div>
      ) : (
        <div className="flex flex-col gap-3">
          {registeredShops
            .filter(shop => {
              const name = shop.shop_name || shop.shopName || '';
              return name.toLowerCase().includes(adminSearchQuery.toLowerCase());
            })
            .map((shop) => {
              const isActive = shop.is_active !== false;
              const shopProductCount = vendorProducts.filter(p => p.shop_id === shop.id).length;

              return (
                <div 
                  key={shop.id}
                  className="bg-[#141416] border border-slate-800/60 rounded-2xl p-4"
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-3 flex-1 min-w-0">
                      <div className="w-12 h-12 rounded-xl bg-slate-800 overflow-hidden flex-shrink-0 flex items-center justify-center">
                        {shop.logo_url ? (
                          <img src={shop.logo_url} alt={shop.shop_name} className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-white font-black text-lg">
                            {(shop.shop_name || 'B').charAt(0).toUpperCase()}
                          </span>
                        )}
                      </div>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-sm font-black text-white truncate">
                          {shop.shop_name || shop.shopName}
                        </h4>
                        <p className="text-[10px] text-slate-400 font-medium truncate">
                          👤 {shop.owner_name || 'Non renseigné'}
                        </p>
                        <p className="text-[10px] text-slate-400 font-medium">
                          📱 {shop.whatsapp || 'Non renseigné'}
                        </p>
                      </div>
                    </div>

                    {/* Interrupteur */}
                    <button
                      onClick={() => handleToggleShopActive(shop)}
                      className={`relative w-12 h-7 rounded-full transition-all flex-shrink-0 ${
                        isActive ? 'bg-emerald-500' : 'bg-slate-700'
                      }`}
                    >
                      <span 
                        className={`absolute top-1 w-5 h-5 bg-white rounded-full shadow-md transition-all ${
                          isActive ? 'left-6' : 'left-1'
                        }`}
                      />
                    </button>
                  </div>

                  <div className="flex items-center gap-3 mt-3 pt-3 border-t border-slate-800/50">
                    <span className={`text-[9px] font-black px-2 py-1 rounded-full uppercase tracking-wider ${
                      isActive 
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                        : 'bg-slate-700/30 text-slate-400 border border-slate-700/50'
                    }`}>
                      {isActive ? '● Visible' : '○ Masquée'}
                    </span>
                    <span className="text-[9px] text-slate-500 font-bold">
                      📦 {shopProductCount} produit{shopProductCount > 1 ? 's' : ''}
                    </span>
                    <span className="text-[9px] text-slate-500 font-bold">
                      💳 {shop.payment_method || '—'}
                    </span>
                  </div>

                  {shop.description && (
                    <p className="text-[10px] text-slate-400 mt-2 leading-relaxed line-clamp-2">
                      {shop.description}
                    </p>
                  )}
                </div>
              );
            })}
        </div>
      )}
    </div>
  </div>
)}


    {/* -------------------- BARRE DE NAVIGATION BASSE (BLEU PASTEL DOMINANT) -------------------- */}
<nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-1.5rem)] max-w-[26rem] bg-white/65 backdrop-blur-2xl border border-white/80 rounded-[1.75rem] shadow-[0_10px_40px_rgba(15,20,25,0.18)] px-2 py-1.5 flex justify-around items-center z-40">
  {[
    { key: 'home', label: 'Accueil', icon: Ico.home, active: currentScreen === 'home', go: () => setCurrentScreen('home') },
    { key: 'shops', label: 'Boutiques', icon: Ico.bag, active: currentScreen === 'all-shops' || currentScreen === 'view-shop', go: () => setCurrentScreen('all-shops') },
    { key: 'sell', label: 'Vendre', icon: Ico.store, active: currentScreen === 'vendre' || currentScreen === 'create-shop' || currentScreen === 'vendor-login',
      go: () => { if (myShop?.id || isLoggedIn) { setCurrentScreen('vendor-dashboard'); } else { setCurrentScreen('vendre'); } } },
    ...((isLoggedIn || myShop?.id) ? [{ key: 'dash', label: 'Ma boutique', icon: Ico.grid, active: currentScreen === 'vendor-dashboard', go: () => setCurrentScreen('vendor-dashboard') }] : []),
  ].map((item) => {
    const Icon = item.icon;
    return (
      <button
        key={item.key}
        type="button"
        onClick={item.go}
        className={`flex flex-col items-center justify-center gap-0.5 py-1.5 px-3.5 rounded-2xl min-w-[64px] transition-all active:scale-90 ${
          item.active ? 'bg-[#63B3ED] text-[#0F1419] shadow-sm' : 'text-[#4B5563] hover:bg-black/5'
        }`}
      >
        <Icon className="w-[22px] h-[22px]" />
        <span className="text-[10px] font-bold tracking-wide">{item.label}</span>
      </button>
    );
  })}
</nav>
</div>
);}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
