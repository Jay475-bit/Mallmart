const { useState, useEffect, useRef } = React;

// --- Mini remplacement de framer-motion (CSS transitions) ---
const AnimatePresence = ({ children }) => children;
const toStyle = (o = {}) => {
  const st = {}; const tf = [];
  const val = (v) => (Array.isArray(v) ? v[v.length - 1] : v);
  if (o.opacity !== undefined) st.opacity = val(o.opacity);
  if (o.width !== undefined) st.width = val(o.width);
  if (o.scale !== undefined) tf.push(`scale(${val(o.scale)})`);
  if (o.x !== undefined) tf.push(`translateX(${val(o.x)}px)`);
  if (o.y !== undefined) tf.push(`translateY(${val(o.y)}px)`);
  if (tf.length) st.transform = tf.join(' ');
  return st;
};
const motion = new Proxy({}, {
  get: (_, tag) => function Motion({ initial, animate, exit, transition, style, ...rest }) {
    const [on, setOn] = useState(false);
    useEffect(() => { const t = setTimeout(() => setOn(true), 30); return () => clearTimeout(t); }, []);
    const d = (transition && transition.duration) || 0.5;
    const delay = (transition && transition.delay) || 0;
    const st = { ...(initial && !on ? toStyle(initial) : {}), ...(on ? toStyle(animate) : {}), ...style,
      transition: `all ${d}s ease ${delay}s` };
    return React.createElement(tag, { ...rest, style: st });
  }
});

// ===== IMAGE UTILS =====
// Redimensionne et compresse une image avant envoi (économise la data mobile en Haïti)
async function compressImage(file, maxSize = 1200, quality = 0.75) {
  if (!(file instanceof File) || !file.type.startsWith('image/')) return file;

  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve(file);
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => resolve(file);
      img.onload = () => {
        const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(
          (blob) => {
            if (!blob || blob.size >= file.size) return resolve(file);
            resolve(new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg', lastModified: Date.now() }));
          },
          'image/jpeg',
          quality
        );
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function ProductQuota({ shop, totalProducts = 0, onUpgradeClick }) {
  const planKey = (shop?.plan_type || 'free').toLowerCase();
  const planInfo = MALLMART_PLANS[planKey] || MALLMART_PLANS.free;

  const maxProducts = planInfo.maxProducts;
  const percentage = Math.min(Math.round((totalProducts / maxProducts) * 100), 100);

  let progressBg = "bg-emerald-500";
  if (percentage >= 66) progressBg = "bg-amber-500";
  if (percentage >= 100) progressBg = "bg-red-500";

  return (
    <div className="flex items-center gap-3 glass-card px-3 py-1.5 rounded-full">
      {/* Badge du plan */}
      <span 
        className="text-[10px] font-black uppercase px-2 py-0.5 rounded-full text-white"

            className={`h-full transition-all duration-300 ${progressBg}`}

  );
}

function UpgradeModal({ isOpen, onClose, currentPlanKey = 'free', shopId, shopName }) {
  const [selectedPlanKey, setSelectedPlanKey] = useState(null);
  const [txnCode, setTxnCode] = useState('');
  const [loading, setLoading] = useState(false);
  const [statusMessage, setStatusMessage] = useState('');

  if (!isOpen) return null;

  const handleOpenPayment = (key) => {
    setSelectedPlanKey(key);
    setStatusMessage('');
    setTxnCode('');
  };

  const handleSubmitTransaction = async (e) => {
    e.preventDefault();
    if (!txnCode.trim()) {
      alert("Veuillez saisir le numéro / code de transaction reçu par SMS.");
      return;
    }

    const targetPlan = MALLMART_PLANS[selectedPlanKey];
    if (!targetPlan) return;

    setLoading(true);
    setStatusMessage('');

    try {
      const { error } = await supabase
        .from('plan_requests')
        .insert([
          {
            shop_id: shopId,
            requested_plan: selectedPlanKey,
            amount_paid: targetPlan.price,
            payment_method: 'natcash',
            transaction_code: txnCode.trim(),
            status: 'pending'
          }
        ]);

      if (error) {
        if (error.code === '23505') {
          throw new Error("Ce code de transaction a déjà été soumis.");
        }
        throw error;
      }

      setStatusMessage("⏳ Transaction enregistrée ! Vérification automatique Natcash en cours...");
      setTxnCode('');
    } catch (err) {
      alert("Erreur : " + err.message);
    } finally {
      setLoading(false);
    }
  };

            Augmentez la capacité de votre boutique Mallmart et vendez plus.

        {/* Vue 1: Liste des Plans de MALLMART_PLANS */}
        {!selectedPlanKey ? (

                      <button
                        onClick={() => handleOpenPayment(key)}
                        className="mt-1 px-3 py-1.5 bg-gradient-to-b from-[#7CC0F5] to-[#4FA3E3] text-[#0b1b2b] font-extrabold text-[10px] rounded-lg shadow-sm transition-all cursor-pointer"
                      >
                        Choisir
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          /* Vue 2: Formulaire de paiement Natcash pour le plan sélectionné */
          <form onSubmit={handleSubmitTransaction} className="space-y-4">
            <button
              type="button"
              onClick={() => setSelectedPlanKey(null)}
              className="text-xs text-royal-700 font-bold hover:underline mb-2 block cursor-pointer"
            >
              ← Revenir aux autres forfaits
            </button>

            <div className="bg-royal-600/10 p-4 rounded-2xl border border-royal-500/30 text-xs space-y-2">
              <div className="flex justify-between items-center border-b border-royal-500/20 pb-2">
                <span className="text-slate-600 font-bold">Forfait sélectionné :</span>
                <span className="text-[#0F1419] font-black uppercase text-sm">{MALLMART_PLANS[selectedPlanKey]?.name}</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-slate-600 font-bold">Montant à payer :</span>
                <span className="text-emerald-700 font-black text-sm">{MALLMART_PLANS[selectedPlanKey]?.price} HTG</span>
              </div>
            </div>

            <div className="bg-black/5 p-3.5 rounded-xl border border-black/10 text-xs space-y-1">
              <p className="text-royal-700 font-extrabold uppercase tracking-wider">Instructions Natcash</p>
              <p className="text-slate-600">Effectuez le transfert Natcash du montant exact au :</p>
              <p className="text-amber-700 font-black text-base pt-1">
                📲 Natcash: +509 42 62 77 08
              </p>
            </div>

            <div>
              <label className="text-xs text-slate-500 font-bold block mb-1">
                Numéro / Ref de transaction Natcash (SMS)
              </label>
              <input
                type="text"
                placeholder="Ex: 89342189"
                value={txnCode}
                onChange={(e) => setTxnCode(e.target.value)}
                className="w-full glass-input rounded-xl p-3 text-sm text-[#0F1419] focus:outline-none focus:ring-2 focus:ring-[#63B3ED]/60"
              />
            </div>

            {statusMessage && (
              <p className="text-xs text-amber-700 font-bold bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 text-center">
                {statusMessage}
              </p>
            )}

            <div className="flex gap-2 pt-2">
              <button
                type="button"
                onClick={() => setSelectedPlanKey(null)}
                className="w-1/3 py-3 bg-white/80 border border-black/10 hover:bg-white text-slate-700 font-bold text-xs rounded-xl cursor-pointer"
              >
                Annuler
              </button>
              <button
                type="submit"
                disabled={loading}
                className="w-2/3 py-3 bg-gradient-to-b from-[#7CC0F5] to-[#4FA3E3] text-[#0b1b2b] font-extrabold text-xs rounded-xl shadow-md transition-all cursor-pointer"
              >
                {loading ? (<span className="inline-flex items-center justify-center gap-2"><Spinner className="w-4 h-4" />Validation...</span>) : 'Confirmer le paiement'}
              </button>
            </div>
          </form>
        )}

      </div>
    </div>
  );
}

// ===== STORE CREATION MODAL =====


const STEPS = [
  { id: 1, label: "Validation des informations...", duration: 1500 },
  { id: 2, label: "Configuration de la base de données...", duration: 2000 },
  { id: 3, label: "Préparation de votre tableau de bord...", duration: 1800 },
  { id: 4, label: "Finalisation et mise en ligne...", duration: 1500 }
];

function StoreCreationModal({ isOpen, onComplete }) {
  const [currentStepIndex, setCurrentStepIndex] = useState(0);
  const [progress, setProgress] = useState(0);
  const [isSlowNetwork, setIsSlowNetwork] = useState(false);

  useEffect(() => {
    if (!isOpen) {
      setCurrentStepIndex(0);
      setProgress(0);
      setIsSlowNetwork(false);
      return;
    }

    if (navigator.vibrate) {
      navigator.vibrate(40);
    }

    const slowTimer = setTimeout(() => {
      setIsSlowNetwork(true);
    }, 7000);

    let stepTimer;
    const runSteps = (index) => {
      if (index < STEPS.length) {
        setCurrentStepIndex(index);
        const targetProgress = ((index + 1) / STEPS.length) * 100;
        setProgress(targetProgress);

        stepTimer = setTimeout(() => {
          runSteps(index + 1);
        }, STEPS[index].duration);
      } else {
        setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate([60, 100, 60]);
          if (onComplete) onComplete();
        }, 800);
      }
    };

    runSteps(0);

    return () => {
      clearTimeout(stepTimer);
      clearTimeout(slowTimer);
    };
  }, [isOpen]);

  if (!isOpen) return null;

  return (
    <AnimatePresence mode="wait">
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <motion.div
          initial={{ opacity: 0, scale: 0.9, y: 20 }}
          animate={{ opacity: 1, scale: 1, y: 0 }}
          exit={{ opacity: 0, scale: 0.9, y: -20 }}
          className="w-full max-w-sm bg-[#0A0A0B] border border-white/10 rounded-3xl p-6 text-white shadow-2xl relative overflow-hidden"
        >
          {/* Halo d'ambiance en arrière-plan */}
          <div className="absolute -top-12 -right-12 w-40 h-40 bg-royal-600/20 rounded-full blur-3xl pointer-events-none" />
          <div className="absolute -bottom-12 -left-12 w-40 h-40 bg-amber-600/20 rounded-full blur-3xl pointer-events-none" />

          {/* Icône animée */}
          <div className="flex justify-center mb-6">
            <div className="relative flex items-center justify-center w-20 h-20 rounded-2xl bg-white/5 border border-white/10">
              <motion.div
                className="absolute inset-0 rounded-2xl bg-gradient-to-tr from-royal-500/30 to-amber-500/30 blur-md"
                animate={{ scale: [1, 1.15, 1], opacity: [0.5, 0.9, 0.5] }}
                transition={{ duration: 2, repeat: Infinity, ease: "easeInOut" }}
              />
              <Ico.store className="w-9 h-9 relative z-10 animate-bounce text-[#63B3ED]" />
            </div>
          </div>

          {/* Titre */}
          <h3 className="text-xl font-bold text-center bg-gradient-to-r from-royal-400 to-amber-400 bg-clip-text text-transparent mb-1">
            Création de votre boutique
          </h3>
          <p className="text-xs text-gray-400 text-center mb-6">
            Veuillez patienter pendant l'initialisation
          </p>

          {/* Liste des sous-étapes */}
          <div className="space-y-3 mb-6">
            {STEPS.map((step, idx) => {
              const isDone = idx < currentStepIndex;
              const isCurrent = idx === currentStepIndex;

              return (
                <div key={step.id} className="flex items-center gap-3">
                  <div className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300">
                    {isDone ? (
                      <span className="w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500 text-emerald-400 flex items-center justify-center">
                        ✓
                      </span>
                    ) : isCurrent ? (
                      <span className="w-6 h-6 rounded-full bg-royal-500/20 border border-royal-400 text-royal-300 flex items-center justify-center animate-pulse">
                        {step.id}
                      </span>
                    ) : (
                      <span className="w-6 h-6 rounded-full bg-white/5 border border-white/10 text-gray-500 flex items-center justify-center">
                        {step.id}
                      </span>
                    )}
                  </div>
                  <span
                    className={`text-xs transition-colors duration-300 ${
                      isDone
                        ? 'text-emerald-400 line-through opacity-70'
                        : isCurrent
                        ? 'text-white font-medium'
                        : 'text-gray-500'
                    }`}
                  >
                    {step.label}
                  </span>
                </div>
              );
            })}
          </div>

          {/* Barre de progression globale */}
          <div className="w-full bg-white/5 h-2 rounded-full overflow-hidden border border-white/10 mb-3">
            <motion.div
              className="h-full bg-gradient-to-r from-royal-500 via-royal-500 to-amber-400"
              animate={{ width: `${progress}%` }}
              transition={{ duration: 0.5, ease: "easeInOut" }}
            />
          </div>

          {/* Indication réseau / Message d'attente */}
          <div className="h-5 text-center">
            {isSlowNetwork ? (
              <motion.p
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                className="text-[11px] text-amber-400/90 font-medium animate-pulse"
              >
                Connexion un peu lente... Ne quittez pas !
              </motion.p>
            ) : (
              <p className="text-[11px] text-gray-400">
                {Math.round(progress)}% complété
              </p>
            )}
          </div>
        </motion.div>
      </div>
    </AnimatePresence>
  );
}

const passwordStrength = (pw) => {
  const p = String(pw || '');
  let score = 0;
  if (p.length >= 6) score++;
  if (p.length >= 10) score++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
  if (/\d/.test(p)) score++;
  if (/[^A-Za-z0-9]/.test(p)) score++;
  const level = p.length === 0 ? 0 : Math.min(4, Math.max(1, score - (p.length < 6 ? 1 : 0)));
  const labels = ['', 'Faible', 'Moyen', 'Bon', 'Fort'];
  const colors = ['', 'bg-red-500', 'bg-amber-500', 'bg-lime-500', 'bg-emerald-500'];
  return { level, label: labels[level], color: colors[level] };
};

const haitiDigits = (v) => {

// Générateur pseudo-aléatoire à graine : l'ordre des boutiques reste stable pendant la session
const seededRandom = (seed) => {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

function PhotoFramer({ file, onCancel, onConfirm }) {
  const FW = Math.min(window.innerWidth - 64, 300);   // largeur du cadre (px)
  const FH = Math.round(FW * 1.25);                    // hauteur : format 4:5
  const [url, setUrl] = useState(null);
  const [nat, setNat] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [busy, setBusy] = useState(false);
  const imgEl = useRef(null);
  const pointers = useRef(new Map());
  const pinch = useRef(null);

  useEffect(() => {
    const u = URL.createObjectURL(file);
    setUrl(u);
    const el = new Image();
    el.onload = () => {
      imgEl.current = el;
      const s0 = Math.max(FW / el.naturalWidth, FH / el.naturalHeight);
      setNat({ w: el.naturalWidth, h: el.naturalHeight });
      setPos({ x: (FW - el.naturalWidth * s0) / 2, y: (FH - el.naturalHeight * s0) / 2 });
    };
    el.src = u;
    return () => URL.revokeObjectURL(u);
  }, [file]);

  const s0 = nat ? Math.max(FW / nat.w, FH / nat.h) : 1;
  const s = s0 * zoom;
  const clampPos = (x, y, w, h) => ({
    x: Math.min(0, Math.max(FW - w, x)),
    y: Math.min(0, Math.max(FH - h, y)),
  });

  const applyZoom = (nz) => {
    if (!nat) return;
    const sNew = s0 * nz;
    const cx = (FW / 2 - pos.x) / s;
    const cy = (FH / 2 - pos.y) / s;
    setZoom(nz);
    setPos(clampPos(FW / 2 - cx * sNew, FH / 2 - cy * sNew, nat.w * sNew, nat.h * sNew));
  };

  const onDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.current.size === 2) {
      const [a, b] = [...pointers.current.values()];
      pinch.current = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom };
    }
  };
  const onMove = (e) => {
    if (!nat || !pointers.current.has(e.pointerId)) return;
    const prev = pointers.current.get(e.pointerId);
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.current.size === 2 && pinch.current) {
      const [a, b] = [...pointers.current.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      applyZoom(Math.min(4, Math.max(1, pinch.current.z * d / pinch.current.d)));
    } else if (pointers.current.size === 1) {
      setPos((p) => clampPos(p.x + (e.clientX - prev.x), p.y + (e.clientY - prev.y), nat.w * s, nat.h * s));
    }
  };
  const onUp = (e) => {
    pointers.current.delete(e.pointerId);
    if (pointers.current.size < 2) pinch.current = null;
  };

  const reset = () => {
    if (!nat) return;
    setZoom(1);
    setPos({ x: (FW - nat.w * s0) / 2, y: (FH - nat.h * s0) / 2 });
  };

  const confirm = () => {
    if (!nat || !imgEl.current || busy) return;
    setBusy(true);
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 1000;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 800, 1000);
    ctx.drawImage(imgEl.current, -pos.x / s, -pos.y / s, FW / s, FH / s, 0, 0, 800, 1000);
    canvas.toBlob((blob) => {
      if (!blob) { setBusy(false); return; }
      onConfirm(new File([blob], `produit-${Date.now()}.jpg`, { type: 'image/jpeg', lastModified: Date.now() }));
    }, 'image/jpeg', 0.88);
  };

  return (
    <div className="fixed inset-0 z-[300] bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="w-full max-w-sm glass rounded-[1.75rem] p-4 text-[#0F1419]">
        <h3 className="text-base font-extrabold tracking-tight">Cadrez votre photo</h3>
        <p className="text-[11px] text-[#4B5563] font-medium mt-0.5 leading-snug">
          Glissez pour positionner, pincez ou utilisez le curseur pour zoomer. Ce cadre est exactement ce que verront les clients.
        </p>

        <div
          className="mx-auto mt-3 relative overflow-hidden rounded-2xl bg-black select-none shadow-lg ring-2 ring-white"
          style={{ width: FW, height: FH, touchAction: 'none' }}
          onPointerDown={onDown}
          onPointerMove={onMove}
          onPointerUp={onUp}
          onPointerCancel={onUp}
        >
          {url && nat && (
            <img
              src={url}
              alt=""
              draggable={false}
              style={{ position: 'absolute', left: pos.x, top: pos.y, width: nat.w * s, height: nat.h * s, maxWidth: 'none', pointerEvents: 'none', userSelect: 'none' }}
            />
          )}
          {/* Grille des tiers */}
          <div className="absolute inset-0 pointer-events-none">
            <div className="absolute left-1/3 top-0 bottom-0 w-px bg-white/40" />
            <div className="absolute left-2/3 top-0 bottom-0 w-px bg-white/40" />
            <div className="absolute top-1/3 left-0 right-0 h-px bg-white/40" />
            <div className="absolute top-2/3 left-0 right-0 h-px bg-white/40" />
          </div>
          {!nat && <div className="absolute inset-0 flex items-center justify-center text-white text-xs font-bold">Chargement…</div>}
        </div>

        <div className="flex items-center gap-3 mt-4 px-1">
          <span className="text-sm font-black">−</span>
          <input
            type="range" min="1" max="4" step="0.01" value={zoom}
            onChange={(e) => applyZoom(parseFloat(e.target.value))}
            className="flex-1 accent-[#63B3ED]"
          />
          <span className="text-sm font-black">+</span>
        </div>

        <div className="flex gap-2 mt-4">
          <button type="button" onClick={onCancel} className="flex-1 py-3 rounded-2xl bg-white/80 border border-black/10 text-xs font-bold active:scale-95 transition-transform">Annuler</button>
          <button type="button" onClick={reset} className="px-4 py-3 rounded-2xl bg-white/80 border border-black/10 text-xs font-bold active:scale-95 transition-transform">Recentrer</button>
          <button type="button" onClick={confirm} disabled={!nat || busy} className="flex-1 py-3 rounded-2xl bg-[#63B3ED] text-[#0F1419] text-xs font-extrabold shadow-md active:scale-95 transition-transform disabled:opacity-50">
            {busy ? <Spinner className="w-4 h-4 mx-auto" /> : 'Valider'}
          </button>
        </div>
      </div>
    </div>
  );
}

const compressStoreLogo = async (file, quality = 0.7) => {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    if (!(file instanceof File)) return resolve(file); // Si c'est déjà une URL

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0, img.width, img.height);

        canvas.toBlob(
          (blob) => {
            if (!blob) return resolve(file);
            const compressedFile = new File([blob], file.name || "logo.jpg", {
              type: "image/jpeg",
              lastModified: Date.now(),
            });
            resolve(compressedFile);
          },
          "image/jpeg",
          quality
        );
      };
      img.onerror = () => resolve(file);
    };
    reader.onerror = () => resolve(file);
  });
};

const formatPrice = (price, currency = 'HTG') => {
  if (price === undefined || price === null || isNaN(price)) return '0';

  const num = Math.round(Number(price));
  const formattedNumber = new Intl.NumberFormat('fr-FR').format(num);

  if (currency === 'USD' || currency === '$') {
    return `$${formattedNumber}`;
  }

  return `${formattedNumber} ${currency}`;
};

                          <p className="text-[11px] text-[#6B7280] font-semibold">
                            {formatPrice(item.unit, item.currency)} · <span className="text-[#0F1419] font-extrabold">{formatPrice(item.unit * item.quantity, item.currency)}</span>
                          </p>
                          <div className="flex items-center gap-2 mt-1.5">
                            <button type="button" onClick={() => updateCartQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-white/80 border border-black/10 font-black text-sm active:scale-90 transition-transform">−</button>
                            <span className="text-sm font-extrabold min-w-[20px] text-center">{item.quantity}</span>
                            <button type="button" onClick={() => updateCartQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-[#63B3ED] font-black text-sm active:scale-90 transition-transform">+</button>
                          </div>
                        </div>
                        <button
                          type="button"
                          aria-label="Retirer du panier"
                          onClick={() => removeFromCart(item.id)}
                          className="w-9 h-9 shrink-0 rounded-full bg-[#E5484D]/10 text-[#E5484D] flex items-center justify-center active:scale-90 transition-transform"
                        >
                          <Ico.trash className="w-[18px] h-[18px]" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {cart.length > 0 && cartStep === 'list' && (
          <div className="px-5 pt-3 pb-6 border-t border-white/70">
            <div className="flex items-end justify-between mb-2">
              <span className="text-xs font-black text-[#4B5563] uppercase tracking-widest">Total</span>
              <span className="text-xl font-extrabold text-right">{formatTotals(cart)}</span>
            </div>
            {cartGroups.length > 1 && (
              <p className="text-[11px] text-[#6B7280] font-medium mb-3 leading-snug">
                Vos produits viennent de {cartGroups.length} boutiques : une commande WhatsApp sera envoyée à chacune.
              </p>
            )}
            <button
              type="button"
              onClick={handleCartConfirm}
              className="w-full bg-[#63B3ED] text-[#0b1b2b] py-3.5 rounded-2xl font-black uppercase tracking-wider text-xs shadow-md active:scale-95 transition-all"
            >
              Confirmer ma commande
            </button>
            <button
              type="button"
              onClick={() => setCart([])}
              className="w-full mt-2 text-[11px] font-bold text-[#6B7280] py-1.5"
            >
              Vider le panier
            </button>
          </div>
        )}
      </div>
    </div>
  ) : null;

  // ==========================================
  // STORIES / STATUS PRODUITS
  // ==========================================
  const STORY_DURATION_MS = 5000;
  const storySeed = useRef(Math.floor(Math.random() * 4294967296));
  const [story, setStory] = useState(null); // { queue: [shopId], shopIdx, itemIdx }
  const [storyProgress, setStoryProgress] = useState(0);
  const [storyHold, setStoryHold] = useState(false);
  const [logoMenuOpen, setLogoMenuOpen] = useState(false);
  const [forgot, setForgot] = useState({ step: 1, shopName: '', phone: '+509 ', owner: '', verifiedShopId: null, verifiedShopName: '', next: '', confirm: '', show: false, error: '' });
  const [pwForm, setPwForm] = useState({ current: '', next: '', confirm: '' });
  const [pwShow, setPwShow] = useState({ current: false, next: false, confirm: false });
  const [pwMsg, setPwMsg] = useState(null); // { type: 'error' | 'success', text }
  const [statusPicker, setStatusPicker] = useState(null); // { product, selected: [urls], slot, editing }
  const [storyLoadedId, setStoryLoadedId] = useState(null);
  const storyTap = useRef({ t: 0, x: 0 });

  const isStatusOn = (p) => p && p.status_order != null && Number(p.status_order) >= 1 && Number(p.status_order) <= 12;

  // Boutiques avec des produits en status + sélection pondérée (récence) des 10 bulles
  const storyData = React.useMemo(() => {
    const activeShops = (registeredShops || []).filter((sh) => sh.is_active !== false);
    const byShop = {};
    (vendorProducts || []).forEach((p) => {
      if (isStatusOn(p)) {
        const k = String(p.shop_id);
        (byShop[k] = byShop[k] || []).push(p);
      }
    });
    Object.keys(byShop).forEach((k) => {
      byShop[k] = byShop[k].sort((a, b) => Number(a.status_order) - Number(b.status_order)).slice(0, 12);
    });
    // Un "slide" par photo choisie pour le status de chaque produit
    const slidesByShop = {};
    Object.keys(byShop).forEach((k) => {
      slidesByShop[k] = byShop[k].flatMap((p) =>
        getStatusImages(p).map((image, i) => ({ product: p, image, key: `${p.id}-${i}` }))
      );
    });

    const rnd = seededRandom(storySeed.current);
    const now = Date.now();
    const storyShops = activeShops
      .filter((sh) => byShop[String(sh.id)] && byShop[String(sh.id)].length > 0)
      .map((sh) => {
        const latest = Math.max(...byShop[String(sh.id)].map((p) => new Date(p.updated_at || p.created_at || 0).getTime() || 0));
        const days = latest ? Math.max(0, (now - latest) / 86400000) : 30;
        const weight = 1 + 3 / (1 + days / 7);           // plus c'est récent, plus la chance d'être en tête est grande
        return { shop: sh, key: Math.pow(rnd(), 1 / weight) };
      })
      .sort((a, b) => b.key - a.key)
      .map((x) => x.shop);

    const bubbles = storyShops.slice(0, 10).map((sh) => ({ shop: sh, hasStory: true }));
    return { byShop, slidesByShop, storyShops, bubbles };
  }, [registeredShops, vendorProducts]);

  const getShopStatusItems = (shopId) => storyData.byShop[String(shopId)] || [];
  const getShopSlides = (shopId) => storyData.slidesByShop[String(shopId)] || [];

  const openStory = (shopId) => {
    const inBubbles = storyData.bubbles.filter((b) => b.hasStory).map((b) => String(b.shop.id));
    const rest = storyData.storyShops.map((sh) => String(sh.id)).filter((id) => !inBubbles.includes(id));
    const idx = inBubbles.indexOf(String(shopId));
    const queue = idx >= 0
      ? [...inBubbles.slice(idx), ...rest, ...inBubbles.slice(0, idx)]
      : [String(shopId), ...inBubbles, ...rest];
    setStoryProgress(0);
    setStoryHold(false);
    setStory({ queue, shopIdx: 0, itemIdx: 0 });
  };
  const closeStory = () => { setStory(null); setStoryHold(false); };

  const findShopWithItems = (queue, from, dir) => {
    for (let i = from; i >= 0 && i < queue.length; i += dir) {
      if (getShopSlides(queue[i]).length > 0) return i;
    }
    return -1;
  };
  const storyNext = () => setStory((prev) => {
    if (!prev) return prev;
    const items = getShopSlides(prev.queue[prev.shopIdx]);
    if (prev.itemIdx < items.length - 1) return { ...prev, itemIdx: prev.itemIdx + 1 };
    const n = findShopWithItems(prev.queue, prev.shopIdx + 1, 1);
    return n === -1 ? null : { ...prev, shopIdx: n, itemIdx: 0 };   // boutique suivante, ou fin
  });
  const storyPrev = () => setStory((prev) => {
    if (!prev) return prev;
    if (prev.itemIdx > 0) return { ...prev, itemIdx: prev.itemIdx - 1 };
    const n = findShopWithItems(prev.queue, prev.shopIdx - 1, -1);
    return n === -1 ? { ...prev } : { ...prev, shopIdx: n, itemIdx: 0 };
  });

  const curShopId = story ? story.queue[story.shopIdx] : null;
  const curShop = curShopId != null ? (registeredShops || []).find((sh) => String(sh.id) === String(curShopId)) : null;
  const curItems = curShopId != null ? getShopSlides(curShopId) : [];
  const curSlide = story ? curItems[story.itemIdx] : null;
  const curProduct = curSlide ? curSlide.product : null;
  const curImg = curSlide ? curSlide.image : null;
  const storyReady = !curProduct || !curImg || storyLoadedId === curSlide.key;   // la barre démarre quand la photo est affichée

  // Remise à zéro de la barre à chaque changement de produit / boutique
  useEffect(() => { setStoryProgress(0); }, [story ? story.shopIdx : -1, story ? story.itemIdx : -1]);
  // Avancement automatique (5 s par produit), en pause pendant un appui long ou quand le panier est ouvert
  useEffect(() => {
    if (!story || storyHold || isCartOpen || !storyReady) return;
    const id = setInterval(() => setStoryProgress((p) => Math.min(1, p + 50 / STORY_DURATION_MS)), 50);
    return () => clearInterval(id);
  }, [!!story, storyHold, isCartOpen, storyReady, story ? story.shopIdx : -1, story ? story.itemIdx : -1]);
  useEffect(() => { if (story && storyProgress >= 1) storyNext(); }, [storyProgress]);
  // Si le produit affiché disparaît (status retiré), on passe au suivant
  useEffect(() => { if (story && !curProduct) storyNext(); }, [story, curProduct]);
  // Préchargement de l'image suivante
  useEffect(() => {
    if (!story) return;
    const nxt = curItems[story.itemIdx + 1];
    const src = nxt && nxt.image;
    if (src) { const im = new Image(); im.src = src; }
  }, [story ? story.shopIdx : -1, story ? story.itemIdx : -1]);

  const storyOrder = (p) => {
    const phone = resolveShopPhone(p);
    if (!phone) { alert("Le numéro WhatsApp du vendeur est introuvable pour ce produit."); return; }
    const unitPrice = Number(p.discount_price || p.discount || p.price || 0);
    const currency = p.currency || 'HTG';
    const message = encodeURIComponent(
      `Salut ! Je souhaite commander à partir de Mallmart :\n\n` +
      `🛍️ Produit : ${p.name}\n` +
      `📦 Quantité : 1\n` +
      `💰 Prix unitaire : ${formatPrice(unitPrice, currency)}\n` +
      `💵 Total : ${formatPrice(unitPrice, currency)}\n\n` +
      `Est-il toujours disponible ?`
    );
    window.location.href = `https://wa.me/${phone}?text=${message}`;
  };

  // Status côté vendeur (maximum 12 produits par boutique, photos au choix)
  const firstFreeStatusSlot = (product) => {
    const used = new Set(
      (vendorProducts || [])
        .filter((p) => String(p.shop_id) === String(product.shop_id) && isStatusOn(p))
        .map((p) => Number(p.status_order))
    );
    for (let i = 1; i <= 12; i++) { if (!used.has(i)) return i; }
    return null;
  };
  const saveProductStatus = (product, slot, urls) => withBusy("Mise à jour du status…", async () => {
    try {
      let { data, error } = await supabase
        .from('products')
        .update({ status_order: slot, status_images: urls })
        .eq('id', product.id)
        .select()
        .single();
      if (error && /status_images/i.test(error.message || '')) {
        // colonne absente : on enregistre au moins le status (1ère photo)
        ({ data, error } = await supabase
          .from('products')
          .update({ status_order: slot })
          .eq('id', product.id)
          .select()
          .single());
        if (!error) alert("Pour choisir les photos du status, ajoutez la colonne status_images dans Supabase. Le produit est en status avec sa première photo.");
      }
      if (error) throw error;
      setVendorProducts((prev) => prev.map((p) => (p.id === data.id ? data : p)));
    } catch (err) {
      alert("Erreur lors de la mise à jour du Status : " + err.message);
    }
  });
  const toggleProductStatus = (product) => {
    if (isStatusOn(product)) { saveProductStatus(product, null, null); return; }
    const slot = firstFreeStatusSlot(product);
    if (slot === null) {
      alert("Limite atteinte : une boutique peut avoir 12 produits en Status au maximum. Retirez-en un d'abord.");
      return;
    }
    const imgs = getProductImages(product);
    if (imgs.length > 1) { setStatusPicker({ product, selected: [...imgs], slot, editing: false }); return; }
    saveProductStatus(product, slot, imgs.length ? [imgs[0]] : null);
  };
  const confirmStatusPicker = () => {
    const sp = statusPicker;
    if (!sp || sp.selected.length === 0) return;
    const ordered = getProductImages(sp.product).filter((u) => sp.selected.includes(u));
    setStatusPicker(null);
    saveProductStatus(sp.product, sp.editing ? Number(sp.product.status_order) : sp.slot, ordered);
  };
  const openForgot = () => {
    setForgot({ step: 1, shopName: loginShopName || '', phone: '+509 ', owner: '', verifiedShopId: null, verifiedShopName: '', next: '', confirm: '', show: false, error: '' });
    setLoginError('');
    setCurrentScreen('vendor-forgot');
  };
  const handleForgotVerify = (e) => withBusy("Vérification en cours…", async () => {
    if (e && e.preventDefault) e.preventDefault();
    const fail = (text) => setForgot((f) => ({ ...f, error: text }));
    const lock = readResetLock();
    if (lock.until && Date.now() < lock.until) {
      return fail(`Trop de tentatives. Réessayez dans ${Math.ceil((lock.until - Date.now()) / 60000)} minute(s).`);
    }
    if (!forgot.shopName.trim()) return fail("Entrez le nom de votre boutique.");
    if (!isValidHaitiPhone(forgot.phone)) return fail(PHONE_ERROR);
    if (!forgot.owner.trim()) return fail("Entrez le nom complet du propriétaire.");
    try {
      const safeName = forgot.shopName.trim().replace(/[\%_]/g, '\$&');
      const { data, error } = await supabase.from('shops').select('id, shop_name, whatsapp, owner_name').ilike('shop_name', safeName);
      if (error) throw error;
      const shop = (data || []).find((sh) => normalizeText(sh.shop_name) === normalizeText(forgot.shopName));
      const phoneOk = shop && haitiDigits(shop.whatsapp) === haitiDigits(forgot.phone);
      const ownerOk = shop && (!normalizeText(shop.owner_name) || normalizeText(shop.owner_name) === normalizeText(forgot.owner));
      if (!shop || !phoneOk || !ownerOk) {
        const count = (lock.count || 0) + 1;
        writeResetLock(count >= 5 ? { count: 0, until: Date.now() + 15 * 60000 } : { count, until: 0 });
        return fail("Ces informations ne correspondent à aucune boutique. Vérifiez le nom, le numéro et le nom du propriétaire.");
      }
      writeResetLock({ count: 0, until: 0 });
      setForgot((f) => ({ ...f, step: 2, verifiedShopId: shop.id, verifiedShopName: shop.shop_name, error: '' }));
    } catch (err) {
      console.error("Erreur de vérification :", err);
      fail("Erreur de connexion au serveur. Réessayez.");
    }
  });
  const handleForgotSave = (e) => withBusy("Enregistrement du mot de passe…", async () => {
    if (e && e.preventDefault) e.preventDefault();
    const fail = (text) => setForgot((f) => ({ ...f, error: text }));
    if (!forgot.verifiedShopId) return fail("Vérification requise. Recommencez.");
    if (forgot.next.length < 6) return fail("Le mot de passe doit contenir au moins 6 caractères.");
    if (forgot.next !== forgot.confirm) return fail("La confirmation ne correspond pas au mot de passe.");
    try {
      const { error } = await supabase.from('shops').update({ password: forgot.next }).eq('id', forgot.verifiedShopId);
      if (error) throw error;
      setLoginShopName(forgot.verifiedShopName);
      setLoginPassword('');
      setLoginError('');
      setLoginNotice("Mot de passe modifié avec succès. Connectez-vous avec votre nouveau mot de passe.");
      setForgot((f) => ({ ...f, step: 1, next: '', confirm: '', owner: '', verifiedShopId: null, error: '' }));
      setCurrentScreen('vendor-login');
    } catch (err) {
      console.error("Erreur de mise à jour :", err);
      fail("Erreur lors de l'enregistrement : " + err.message);
    }
  });
  const handleChangePassword = () => withBusy("Mise à jour du mot de passe…", async () => {
    setPwMsg(null);
    const { current, next, confirm } = pwForm;
    if (!current || !next || !confirm) return setPwMsg({ type: 'error', text: 'Remplissez les trois champs.' });
    if (next.length < 6) return setPwMsg({ type: 'error', text: 'Le nouveau mot de passe doit contenir au moins 6 caractères.' });
    if (next === current) return setPwMsg({ type: 'error', text: "Le nouveau mot de passe doit être différent de l'ancien." });
    if (next !== confirm) return setPwMsg({ type: 'error', text: 'La confirmation ne correspond pas au nouveau mot de passe.' });
    try {
      const { data: row, error: readErr } = await supabase.from('shops').select('password').eq('id', myShop.id).single();
      if (readErr) throw readErr;
      if (String(row?.password ?? '') !== current) return setPwMsg({ type: 'error', text: 'Le mot de passe actuel est incorrect.' });
      const { data, error } = await supabase.from('shops').update({ password: next }).eq('id', myShop.id).select().single();
      if (error) throw error;
      setMyShop(data);
      setRegisteredShops((prev) => prev.map((sh) => (sh.id === data.id ? data : sh)));
      setPwForm({ current: '', next: '', confirm: '' });
      setPwShow({ current: false, next: false, confirm: false });
      setPwMsg({ type: 'success', text: 'Mot de passe mis à jour. Utilisez-le à votre prochaine connexion.' });
    } catch (err) {
      setPwMsg({ type: 'error', text: 'Erreur : ' + err.message });
    }
  });
  const openOwnStory = () => {
    if (!myShop?.id || getShopSlides(myShop.id).length === 0) return;
    setLogoMenuOpen(false);
    setStoryProgress(0);
    setStoryHold(false);
    setStory({ queue: [String(myShop.id)], shopIdx: 0, itemIdx: 0, own: true });
  };

  const stop = (e) => e.stopPropagation();
  const storyViewer = (story && curShop && curProduct) ? (() => {
    const img = curSlide.image;
    const disc = curProduct.discount_price || curProduct.discount;
    const cur = curProduct.currency || 'HTG';
    const logo = curShop.logo_url || curShop.logo;
    const shopName = curShop.shop_name || curShop.shopName || 'Boutique';
    return (
      <div className="fixed inset-0 z-[100] bg-black flex items-center justify-center">
        <div
          className="relative w-full max-w-md h-full overflow-hidden select-none bg-black"
          style={{ touchAction: 'manipulation' }}
          onPointerDown={(e) => { storyTap.current = { t: Date.now(), x: e.clientX }; setStoryHold(true); }}
          onPointerUp={(e) => {
            setStoryHold(false);
            const held = Date.now() - storyTap.current.t;
            const moved = Math.abs(e.clientX - storyTap.current.x);
            if (held < 260 && moved < 12) {
              const rect = e.currentTarget.getBoundingClientRect();
              if (e.clientX - rect.left < rect.width * 0.33) { storyPrev(); setStoryProgress(0); }
              else storyNext();
            }
          }}
          onPointerCancel={() => setStoryHold(false)}
          onPointerLeave={() => setStoryHold(false)}
        >
          {/* Photo : fond flou + image entière */}
          {img ? (
            <>
              <img src={img} alt="" draggable={false} className="absolute inset-0 w-full h-full object-cover scale-110 blur-2xl opacity-70 pointer-events-none" />
              <img key={curSlide.key} src={img} alt={curProduct.name} draggable={false} onLoad={() => setStoryLoadedId(curSlide.key)} onError={() => setStoryLoadedId(curSlide.key)} className="absolute inset-0 w-full h-full object-contain pointer-events-none animate-in fade-in" />
            </>
          ) : (
            <div className="absolute inset-0 flex items-center justify-center text-7xl pointer-events-none">📦</div>
          )}
          {!storyReady && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><Spinner className="w-10 h-10 text-white" /></div>
          )}
          <div className="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-black/75 to-transparent pointer-events-none" />
          <div className="absolute bottom-0 inset-x-0 h-80 bg-gradient-to-t from-black/90 via-black/60 to-transparent pointer-events-none" />

          {/* Barres de progression */}
          <div className="absolute inset-x-0 px-3 flex gap-1 pointer-events-none" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 12px)' }}>
            {curItems.map((_, i) => (
              <div key={i} className="flex-1 h-[3px] rounded-full bg-white/30 overflow-hidden">
                <div
                  className="h-full bg-white rounded-full"
                  style={{ width: i < story.itemIdx ? '100%' : i === story.itemIdx ? `${storyProgress * 100}%` : '0%' }}
                />
              </div>
            ))}
          </div>

          {/* En-tête : boutique + fermer */}
          <div className="absolute inset-x-0 px-3 flex items-center justify-between" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 26px)' }}>
            <div className="flex items-center gap-2.5 min-w-0 pointer-events-none">
              <div className="w-10 h-10 rounded-full overflow-hidden bg-white/20 border-2 border-white/70 flex items-center justify-center shrink-0">
                {logo ? <img src={logo} alt={shopName} className="w-full h-full object-cover" /> : <span className="text-white font-extrabold">{shopName.charAt(0).toUpperCase()}</span>}
              </div>
              <div className="min-w-0">
                <p className="text-white text-sm font-extrabold truncate leading-tight">{shopName}</p>
                <p className="text-white/70 text-[11px] font-semibold leading-tight">Status · {story.itemIdx + 1}/{curItems.length}</p>
              </div>
            </div>
            <button
              type="button"
              aria-label="Fermer"
              onPointerDown={stop}
              onPointerUp={stop}
              onClick={(e) => { e.stopPropagation(); closeStory(); }}
              className="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white flex items-center justify-center active:scale-90 transition-transform"
            >
              <Ico.close className="w-5 h-5" />
            </button>
          </div>

          {/* Infos produit + actions */}
          <div className="absolute inset-x-0 bottom-0 px-4" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 16px)' }}>
            <div className="pointer-events-none">
              <p className="flex items-center gap-1.5 text-white/80 text-[12px] font-bold uppercase tracking-wider mb-1"><Ico.store className="w-3.5 h-3.5" />{shopName}</p>
              <h3 className="text-white text-2xl font-extrabold leading-tight tracking-tight line-clamp-2 capitalize">
                {curProduct.name || 'Produit'}
              </h3>
              <div className="flex items-end gap-2.5 mt-1.5 mb-4">
                <span className="text-white text-xl font-extrabold">{formatPrice(disc || curProduct.price || 0, cur)}</span>
                {disc && <span className="text-white/60 text-sm font-semibold line-through">{formatPrice(curProduct.price, cur)}</span>}
              </div>
            </div>

            {story.own ? (
              <div className="flex items-center gap-2 text-[11px] font-bold text-white/75 pb-1"><Ico.eye className="w-4 h-4" /> Aperçu : c'est ce que voient vos clients</div>
            ) : (
            <div onPointerDown={stop} onPointerUp={stop}>
              <div className="flex gap-2.5">
                <button
                  type="button"
                  onClick={() => addToCart(curProduct, 1)}
                  className="flex-1 flex items-center justify-center gap-2 bg-white/15 backdrop-blur-md border border-white/40 text-white py-3.5 rounded-2xl font-extrabold text-xs uppercase tracking-wide active:scale-95 transition-transform"
                >
                  <Ico.cart className="w-4 h-4" />
                  Ajouter au panier
                </button>
                <button
                  type="button"
                  onClick={() => storyOrder(curProduct)}
                  className="flex-1 bg-[#63B3ED] text-[#0b1b2b] py-3.5 rounded-2xl font-black text-xs uppercase tracking-wide shadow-lg active:scale-95 transition-transform"
                >
                  Commander
                </button>
              </div>
              <button
                type="button"
                onClick={() => { const sh = curShop; closeStory(); setSelectedShop(sh); setCurrentScreen('view-shop'); }}
                className="w-full mt-2.5 py-3 rounded-2xl border border-white/40 text-white font-bold text-xs active:scale-95 transition-transform"
              >
                Voir la boutique {shopName} →
              </button>
            </div>
            )}
          </div>
        </div>
      </div>
    );
  })() : null;

<button
  onClick={async () => {
    const selectedPlanKey = formData.plan || 'free';
    const selectedPlan = SHOP_PLANS[selectedPlanKey] || SHOP_PLANS['free'];

    // Validation selon le type de plan
    if (selectedPlan.isPaid) {
      if (!formData.paymentMethod) {
        alert('Veuillez sélectionner une méthode de règlement.');
        return;
      } 
      if ((formData.paymentMethod === 'moncash' || formData.paymentMethod === 'natcash') && !formData.transactionCode) {
        alert('Le code de transaction est obligatoire pour valider le paiement.');
        return;
      }
    }

    if (!isValidHaitiPhone(formData.whatsapp)) {
      alert(PHONE_ERROR);
      return;
    }

    // 🚀 DÉCLENCHEMENT DE L'ANIMATION ET VERROUILLAGE
    setIsCreatingStore(true);

    try {
      // 1. Vérifier si le nom existe déjà dans Supabase
      const { data: existingShops, error: checkError } = await supabase
        .from('shops')
        .select('id')
        .ilike('shop_name', formData.shopName.trim());

      if (checkError) throw checkError;

      if (existingShops && existingShops.length > 0) {
        setIsCreatingStore(false); // Ferme l'animation si erreur
        alert("Ce nom de boutique est déjà pris ! Choisissez un autre nom unique.");
        return;
      }

      // 2. Upload du logo vers ImgBB via API FormData
      let logoUrl = '';
      let deleteUrl = '';

      if (formData.logo && formData.logo instanceof File) {
        const imgData = new FormData();
        imgData.append('image', formData.logo);

        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: imgData,
        });

        const imgbbJson = await imgbbRes.json();

        if (!imgbbJson.success) {
          throw new Error("Échec de l'envoi de l'image sur ImgBB.");
        }

        logoUrl = imgbbJson.data.url;
        deleteUrl = imgbbJson.data.delete_url;
      }

      // 3. Insertion de la boutique dans la table 'shops'
      const newShopData = {
        shop_name: formData.shopName.trim(),
        whatsapp: formData.whatsapp,
        password: formData.password,
        owner_name: formData.ownerName,
        logo_url: logoUrl,
        delete_url: deleteUrl,
        description: formData.description || 'Boutique officielle',
        plan_type: 'free', // le plan payant n'est appliqué qu'après validation admin
        payment_method: selectedPlan.isPaid ? formData.paymentMethod : 'gratuit',
        transaction_code: selectedPlan.isPaid ? formData.transactionCode : 'FREE-PLAN',
        is_active: !selectedPlan.isPaid
      };

      const { data: insertedShop, error: insertError } = await supabase
        .from('shops')
        .insert([newShopData])
        .select()
        .single();

      if (insertError) throw insertError;

      // 3b. Plan payant : on enregistre la demande pour validation admin
      if (selectedPlan.isPaid) {
        const { error: reqError } = await supabase.from('plan_requests').insert([{
          shop_id: insertedShop.id,
          requested_plan: selectedPlanKey,
          amount_paid: selectedPlan.price,
          payment_method: formData.paymentMethod,
          transaction_code: formData.transactionCode.trim(),
          status: 'pending'
        }]);
        if (reqError) {
          await supabase.from('shops').delete().eq('id', insertedShop.id); // rollback
          throw reqError.code === '23505'
            ? new Error("Ce code de transaction a déjà été utilisé.")
            : reqError;
        }
      }

      // 4. Mise à jour de l'état local et préparation de la redirection
      setMyShop(insertedShop);
      setIsLoggedIn(true);

      if (typeof loadAppData === 'function') {
        await loadAppData();
      }
      setStoreCreated(true); // la redirection attend aussi la fin de l'animation

      // Note : La redirection vers 'vendor-dashboard' se fait maintenant 
      // dans la fonction handleStoreCreationComplete() quand l'animation se termine.

    } catch (err) {
      // ❌ Fermeture du modal d'animation en cas d'erreur
      setIsCreatingStore(false);
      setStoreCreated(false);
      setAnimationDone(false);
      console.error("Erreur lors de la création de la boutique :", err.message);
      alert("Erreur lors de la création de la boutique : " + err.message);
    }
  }}

          onClick={() => withBusy("Application du discount…", async () => {
            const newPrice = parseFloat(discountValue);
            const currentPrice = parseFloat(discountingProduct.price);

            if (!discountValue || isNaN(newPrice)) {
              alert("Veuillez entrer un montant valide.");
              return;
            }
            if (newPrice >= currentPrice) {
              alert("Le prix discount doit être strictement inférieur au prix actuel.");
              return;
            }

            try {
              const { data: updatedProduct, error } = await supabase
                .from('products')
                .update({ discount_price: newPrice })
                .eq('id', discountingProduct.id)
                .select()
                .single();

              if (error) throw error;

              setVendorProducts(vendorProducts.map(p => p.id === updatedProduct.id ? updatedProduct : p));
              setDiscountingProduct(null);

              alert("Erreur lors de l'application du discount : " + err.message);

      {/* Total */}
      <div className="px-6 py-4 flex items-center justify-between">
        <span className="text-xs font-black text-[#4B5563] uppercase tracking-widest">
          Total
        </span>
        <span className="text-2xl font-black text-[#111111]">
  {formatPrice(
    (orderModalProduct.discount_price || orderModalProduct.price || 0) * (orderQuantity || 1),
    orderModalProduct.currency || 'HTG'
  )}
</span>
      </div>

      {/* Description produit */}
      {orderModalProduct.description && (
        <div className="px-6 py-3 bg-white/40 border border-white/60 mx-4 rounded-2xl mb-2 shadow-xs">
          <p className="text-[10px] font-black text-[#4B5563] uppercase tracking-widest mb-1.5">
            📝 Description du vendeur
          </p>
          <p className="text-[11px] text-[#111111]/90 leading-relaxed font-medium">
            {orderModalProduct.description}
          </p>
        </div>
      )}

     {/* Boutons : ajouter au panier / confirmer */}
<div className="px-6 pt-3 pb-8 flex flex-col gap-2.5">
  <button
    type="button"
    onClick={() => { addToCart(orderModalProduct, orderQuantity || 1); setOrderModalProduct(null); setOrderQuantity(1); }}
    className="relative z-50 w-full flex items-center justify-center gap-2 bg-white/80 border-2 border-[#63B3ED] active:scale-95 text-[#0b1b2b] py-3 rounded-2xl font-black uppercase tracking-wider text-xs shadow-sm transition-all"
  >
    <Ico.cart className="w-4 h-4" />
    Ajouter à mon panier
  </button>
  <button
    type="button"
    onClick={handleConfirmOrder}
    className="relative z-50 w-full bg-[#63B3ED] hover:opacity-95 active:scale-95 text-[#0b1b2b] py-3.5 rounded-2xl font-black uppercase tracking-wider text-xs shadow-md transition-all"
  >
    Confirmer ma commande
  </button>
</div>
    </div>
  </div>
)}

{/* -------------------- ÉCRAN CONNEXION ADMIN -------------------- */}
{currentScreen === 'admin-login' && (
  <div className="bg-gradient-to-b from-[#0A4D68] via-[#2B7FC4] to-[#18181B] min-h-screen pb-24 font-sans flex flex-col justify-center">
    <div className="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full px-6">
      <div className="bg-white/10 backdrop-blur-md rounded-[2.25rem] p-6 shadow-2xl border border-white/10">
        
        <div className="text-center mb-6">
          <span className="text-3xl">🔐</span>
          <h2 className="text-xl font-black text-white uppercase tracking-tight mt-2">
            Espace Admin
          </h2>
          <p className="text-[11px] text-royal-200/70 font-bold mt-1 uppercase tracking-wide">
            Accès réservé
          </p>
        </div>

        {adminLoginError && (
          <div className="bg-red-500/10 text-red-300 font-bold text-[11px] p-3 rounded-xl mb-4 border border-red-500/20 text-center uppercase tracking-wide">
            ⚠️ {adminLoginError}
          </div>
        )}

        <form onSubmit={(e) => withBusy("Connexion en cours…", async () => {
          e.preventDefault();
          setAdminLoginError('');

          try {
            const { data: admins, error } = await supabase
              .from('admin_users')
              .select('*')
              .eq('username', adminLoginUsername.trim());

            if (error) throw error;

            const adminFound = admins && admins.length > 0 ? admins[0] : null;

            if (adminFound && adminFound.password === adminLoginPassword) {
              setCurrentAdmin(adminFound);
              setIsAdminLoggedIn(true);
              setCurrentScreen('admin-dashboard');
            } else {
              setAdminLoginError("Identifiant ou mot de passe incorrect");
            }
          } catch (err) {
            console.error("Erreur de connexion admin :", err.message);
            setAdminLoginError("Erreur de connexion au serveur. Réessayez.");
          }
        })} className="flex flex-col gap-4">

          <div>
            <label className="block text-[10px] font-black text-[#63B3ED] uppercase tracking-widest mb-1.5">
              Identifiant
            </label>
            <input 
              type="text"
              autoComplete="off"
              required
              value={adminLoginUsername}
              onChange={(e) => setAdminLoginUsername(e.target.value)}
              className="w-full bg-white/10 border border-white/20 rounded-xl py-2.5 px-4 text-xs font-bold text-white outline-none focus:border-[#63B3ED] transition-all"
            />
          </div>

          <div>
            <label className="block text-[10px] font-black text-[#63B3ED] uppercase tracking-widest mb-1.5">
              Mot de passe
            </label>
            <input 
              type="password"
              autoComplete="new-password"
              required
              placeholder="••••••••"
              value={adminLoginPassword}
              onChange={(e) => setAdminLoginPassword(e.target.value)}
              className="w-full bg-white/10 border border-white/20 rounded-xl py-2.5 px-4 text-xs font-bold text-white outline-none focus:border-[#63B3ED] transition-all"
            />
          </div>

          <button 
            type="submit"
            className="w-full mt-2 bg-[#63B3ED] text-[#0b1b2b] font-black text-xs py-3 rounded-xl shadow-lg shadow-royal-500/20 active:scale-95 transition-all uppercase tracking-wider"
          >
            Se connecter
          </button>

          <button
            type="button"
            onClick={() => alert("Pour réinitialiser le mot de passe admin, modifiez-le directement dans Supabase (table admin_users).")}
            className="text-[10px] text-royal-200/60 font-bold text-center hover:text-royal-200 transition-colors mt-1"
          >
            Mot de passe oublié ?
          </button>
        </form>
      </div>
    </div>
  </div>
)}

{/* -------------------- DASHBOARD ADMIN -------------------- */}
{currentScreen === 'admin-dashboard' && (
  <div className="min-h-screen bg-[#0A0A0B] text-slate-100 p-4 font-sans pb-24">
    
    {/* Header */}
    <div className="flex justify-between items-center mb-6 px-4 pt-4 pb-3 -mx-4 sticky top-0 z-30 bg-white/10 backdrop-blur-xl border-b border-white/10">
      <div>
        <h1 className="text-lg font-black text-white">
          👋 Bonjour, {currentAdmin?.full_name || 'Admin'}
        </h1>
        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
          Panneau d'administration
        </p>
      </div>
      <button 
        onClick={() => {
          setIsAdminLoggedIn(false);
          setCurrentAdmin(null);
          setCurrentScreen('home');
        }}
        className="bg-[#1C1C1F] hover:bg-[#27272B] border border-slate-800 text-slate-300 font-bold text-[10px] px-3 py-2 rounded-xl transition-all active:scale-95"
      >
        Déconnexion
      </button>
    </div>

    {/* Stats rapides */}
    <div className="grid grid-cols-3 gap-2 mb-6 px-2">
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-[#63B3ED]">{registeredShops.length}</p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Boutiques</p>
      </div>
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-emerald-400">
          {registeredShops.filter(s => s.is_active !== false).length}
        </p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Actives</p>
      </div>
      <div className="bg-[#141416] border border-slate-800/60 rounded-2xl p-3 text-center">
        <p className="text-xl font-black text-royal-400">{vendorProducts.length}</p>
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wide mt-0.5">Produits</p>
      </div>
    </div>

    {/* Demandes de forfait à valider (MonCash / NatCash) */}
    <div className="px-2 mb-6">
      <h3 className="text-xs font-black text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
        <span className="w-1.5 h-4 rounded-full bg-amber-500"></span>
        Paiements à valider ({planRequests.length})
      </h3>
      {planRequests.length === 0 ? (
        <p className="text-[11px] text-slate-500 font-bold bg-[#141416] rounded-2xl p-4 text-center border border-slate-800/60">Aucune demande en attente</p>
      ) : (
        <div className="flex flex-col gap-2">
          {planRequests.map((req) => {
            const reqShop = registeredShops.find((sh) => sh.id === req.shop_id);
            return (
              <div key={req.id} className="bg-[#141416] border border-amber-500/20 rounded-2xl p-3 text-[11px]">
                <p className="font-black text-white">{reqShop?.shop_name || 'Boutique inconnue'} → <span className="uppercase text-amber-400">{req.requested_plan}</span></p>
                <p className="text-slate-400 mt-0.5">{req.amount_paid} HTG · {req.payment_method} · Code : <span className="text-white font-bold">{req.transaction_code}</span></p>
                <div className="flex gap-2 mt-2">
                  <button onClick={() => handlePlanRequest(req, true)} className="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-black text-[10px] uppercase active:scale-95">Valider</button>
                  <button onClick={() => handlePlanRequest(req, false)} className="flex-1 py-2 rounded-xl bg-slate-700 text-slate-200 font-black text-[10px] uppercase active:scale-95">Refuser</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>

    {/* Recherche */}
    <div className="px-2 mb-4">
      <input
        type="text"
        placeholder="Rechercher une boutique..."
        value={adminSearchQuery}
        onChange={(e) => setAdminSearchQuery(e.target.value)}
        className="w-full h-11 bg-[#141416] border border-slate-800 focus:border-royal-500 rounded-xl px-4 text-white placeholder:text-slate-500 outline-none transition-all text-xs"
      />
    </div>

    {/* Liste des boutiques */}
    <div className="px-2">
      <h3 className="text-xs font-black text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
        <span className="w-1.5 h-4 rounded-full bg-royal-500"></span>
        Toutes les boutiques
      </h3>

      {registeredShops.length === 0 ? (
        <div className="text-center py-12 bg-[#141416] rounded-3xl border-2 border-dashed border-slate-800">
          <p className="text-[11px] text-slate-400 font-bold">Aucune boutique enregistrée</p>
        </div>
      ) : (
        <div className="flex flex-col gap-3">
          {registeredShops
            .filter(shop => {
              const name = shop.shop_name || shop.shopName || '';
              return name.toLowerCase().includes(adminSearchQuery.toLowerCase());
            })
            .map((shop) => {
              const isActive = shop.is_active !== false;
              const shopProductCount = vendorProducts.filter(p => p.shop_id === shop.id).length;

              return (
                <div 
                  key={shop.id}
                  className="bg-[#141416] border border-slate-800/60 rounded-2xl p-4"
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-3 flex-1 min-w-0">
                      <div className="w-12 h-12 rounded-xl bg-slate-800 overflow-hidden flex-shrink-0 flex items-center justify-center">
                        {shop.logo_url ? (
                          <img src={shop.logo_url} alt={shop.shop_name} className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-white font-black text-lg">
                            {(shop.shop_name || 'B').charAt(0).toUpperCase()}
                          </span>
                        )}
                      </div>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-sm font-black text-white truncate">
                          {shop.shop_name || shop.shopName}
                        </h4>
                        <p className="text-[10px] text-slate-400 font-medium truncate">
                          👤 {shop.owner_name || 'Non renseigné'}
                        </p>
                        <p className="text-[10px] text-slate-400 font-medium">
                          📱 {shop.whatsapp || 'Non renseigné'}
                        </p>
                      </div>
                    </div>

                    {/* Interrupteur */}
                    <button
                      onClick={() => handleToggleShopActive(shop)}
                      className={`relative w-12 h-7 rounded-full transition-all flex-shrink-0 ${
                        isActive ? 'bg-emerald-500' : 'bg-slate-700'
                      }`}
                    >
                      <span 
                        className={`absolute top-1 w-5 h-5 bg-white rounded-full shadow-md transition-all ${
                          isActive ? 'left-6' : 'left-1'
                        }`}
                      />
                    </button>
                  </div>

                  <div className="flex items-center gap-3 mt-3 pt-3 border-t border-slate-800/50">
                    <span className={`text-[9px] font-black px-2 py-1 rounded-full uppercase tracking-wider ${
                      isActive 
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                        : 'bg-slate-700/30 text-slate-400 border border-slate-700/50'
                    }`}>
                      {isActive ? '● Visible' : '○ Masquée'}
                    </span>
                    <span className="text-[9px] text-slate-500 font-bold">
                      📦 {shopProductCount} produit{shopProductCount > 1 ? 's' : ''}
                    </span>
                    <span className="text-[9px] text-slate-500 font-bold">
                      💳 {shop.payment_method || '—'}
                    </span>
                  </div>

                  {shop.description && (
                    <p className="text-[10px] text-slate-400 mt-2 leading-relaxed line-clamp-2">
                      {shop.description}
                    </p>
                  )}
                </div>
              );
            })}
        </div>
      )}
    </div>
  </div>
)}


    {/* -------------------- BARRE DE NAVIGATION BASSE (BLEU PASTEL DOMINANT) -------------------- */}
<nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-1.5rem)] max-w-[26rem] glass rounded-[1.75rem] px-2 py-1.5 flex justify-around items-center z-40">
  {[
    { key: 'home', label: 'Accueil', icon: Ico.home, active: currentScreen === 'home', go: () => setCurrentScreen('home') },
    { key: 'shops', label: 'Boutiques', icon: Ico.bag, active: currentScreen === 'all-shops' || currentScreen === 'view-shop', go: () => setCurrentScreen('all-shops') },
    { key: 'sell', label: 'Vendre', icon: Ico.store, active: currentScreen === 'vendre' || currentScreen === 'create-shop' || currentScreen === 'vendor-login',
      go: () => { if (myShop?.id || isLoggedIn) { setCurrentScreen('vendor-dashboard'); } else { setCurrentScreen('vendre'); } } },
    ...((isLoggedIn || myShop?.id) ? [{ key: 'dash', label: 'Ma boutique', icon: Ico.grid, active: currentScreen === 'vendor-dashboard', go: () => setCurrentScreen('vendor-dashboard') }] : []),
  ].map((item) => {
    const Icon = item.icon;
    return (
      <button
        key={item.key}
        type="button"
        onClick={item.go}
        className={`flex flex-col items-center justify-center gap-0.5 py-1.5 px-3.5 rounded-2xl min-w-[64px] transition-all active:scale-90 ${
          item.active ? 'bg-gradient-to-b from-[#7CC0F5] to-[#4FA3E3] text-[#0F1419] shadow-[0_6px_16px_rgba(99,179,237,0.55),inset_0_1px_0_rgba(255,255,255,0.6)]' : 'text-[#4B5563] hover:bg-black/5'
        }`}
      >
        <Icon className="w-[22px] h-[22px]" />
        <span className="text-[10px] font-bold tracking-wide">{item.label}</span>
      </button>
    );
  })}
</nav>
</div>
);}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
